<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built to Last</title>
<!--
  Built to Last, Round Two deck: the plan is round2/Round2_Deck_Plan.md (the look in §6; the tests, the type scale
  and the grid in §4); the talk and its timing are round2/Talk_Outline.md. One family, Plus Jakarta Sans, for every part
  (Pete chose it on 24 Oct from four candidates set side by side): the hierarchy comes from size, weight and colour. The written case's crimson as the one accent, its wine for weight, a greyed rose and warm neutrals for the rest.
  Fonts: SIL Open Font License (fonts/OFL-*.txt).
  Every slide's script is its <aside class="notes">: the spoken words, then "[Notes: ...]" for background. make.py
  writes them to Axis_Script.html and Axis_Script.md.
-->
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-Regular.ttf");font-weight:400}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-Medium.ttf");font-weight:500}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-SemiBold.ttf");font-weight:600}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-Bold.ttf");font-weight:700}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-ExtraBold.ttf");font-weight:800}

/* ---- look B, as tokens ---- */
/* 24 Oct, Pete (after a trial on slide 3): slide 4's tones for every slide, on white: rose-tinted secondary text
   and rules, soft rose fills, wine and crimson with depth (--wine-g, --accent-g; #p4wine and #p4rose in 99_tail
   for SVG), the conclusion bar as a small stage. */
/* 23 Oct, evening (Pete): one clear font for every part, as in e-Sentry: Plus Jakarta Sans throughout (Pete's pick, 24 Oct, over
   Bricolage Grotesque, Schibsted Grotesk and Manrope; Inter before it), the hierarchy made by size, weight and colour, not by
   switching faces. (Earlier the same day: EB Garamond for titles and numbers.) warm neutrals tuned to the crimson;
   wine for weight; a greyed rose for secondary fills (23 Oct: the pale pinks read as pink, not as the
   crimson's family). */
.lb{--paper:#FFFFFF;--mist:#F8EFF0;--rule:#ECDADD;--grey:#B5979D;--slate:#80606A;--ink:#1B1716;
    --accent:#C80E1E;--accent-deep:#890816;--wine:#971320;--rose:#EFD9DC;--tint:#F8EFF0;
    --wine-g:linear-gradient(180deg,#C41627 0%,#700E19 100%);--accent-g:linear-gradient(180deg,#D40F1F 0%,#971320 100%);
    --rose-g:linear-gradient(90deg,#F3E2E4 0%,#E7CCD1 100%);
    --text:"Plus Jakarta Sans",Arial,sans-serif;--head:"Plus Jakarta Sans",Arial,sans-serif;font-variant-numeric:lining-nums}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#DADDE0}
p,h1,h2,h3,h4,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.deck{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0}
.slide{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:var(--paper);color:var(--ink);
  font:400 16px/1.42 var(--text);padding:34px 48px 0;display:flex;flex-direction:column}
@page{size:1280px 720px;margin:0}
@media print{body{background:#fff}.deck{gap:0;padding:0;display:block}.slide{break-after:page}.slide:last-of-type{break-after:auto}}
p,li,span,b{text-wrap:pretty}
.tag{font:400 12px/1 var(--text);color:var(--slate);white-space:nowrap}
.tag::before{content:"("}.tag::after{content:")"}

/* ---- header: kicker, title ---- */
.hd{display:flex;flex-direction:column;gap:5px}
.kick{display:flex;align-items:center;gap:10px;font:600 18px/1.2 var(--head);color:var(--slate)}
.kick small{font:400 14px/1 var(--text);color:var(--slate)}
.hd h2{font:600 32px/1.12 var(--head);letter-spacing:-.2px;max-width:1100px;text-wrap:balance}

/* ---- three panels on a 12-column grid; headings on a rule read as one sentence ---- */
.panels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;margin-top:22px}
.pn{display:flex;flex-direction:column;min-width:0}
.pn>h3{font:600 18px/1.25 var(--head);padding-bottom:8px;border-bottom:1.5px solid var(--ink);margin-bottom:14px}
.cap{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:auto;padding-top:8px}

/* ---- conclusion bar ---- */
/* 24 Oct (Pete): the conclusion is a crimson bar, white text, centred: without a bar the last line didn't read as the
   slide's conclusion. (23 Oct it was a line on a crimson rule, after a wine block had outweighed the focal numbers.) */
.bar{flex:none;margin-top:16px;background:radial-gradient(ellipse 70% 260% at 50% 50%,#C41627 0%,#A51322 45%,#700E19 100%);color:#fff;font:600 18px/1.3 var(--head);padding:12px 24px;text-align:center;text-wrap:balance}

/* ---- footer ---- */
.ft{flex:none;height:52px;display:flex;align-items:center;gap:20px;font:400 12px/1.3 var(--text);color:var(--slate)}
.ft .src{flex:1}


/* ==================== B · Swiss ==================== */
.lb .gb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--accent);color:#fff;font:700 18px/1 var(--head);flex:none}
.lb .kick{color:var(--accent);font:600 14px/1.3 var(--text)}
.lb .hd h2{font-size:29px;font-weight:700;line-height:1.16;letter-spacing:-.5px}
.lb .pn>h3,.lb .x2 h3{font-size:22px}
.lb .dimn{position:absolute;top:8px;height:12px;border:2px solid var(--ink);border-top:0}
.lb .dimn span{position:absolute;left:50%;top:18px;transform:translateX(-50%);font:600 14px/1 var(--head);white-space:nowrap}
.lb .dimx{display:none}
.lb .trk{position:absolute;top:36px;right:48px;display:flex;gap:6px;font:600 14px/1 var(--head);color:var(--grey)}
.lb .trk span{padding:5px 8px;border:1.5px solid var(--rule)}
.lb .trk span.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* cover B */
.lb.cv{padding:0}
.lb.cv .top{height:14px;background:var(--accent);width:240px;margin:56px 0 0 56px}
.lb.cv h1{font:700 150px/.9 var(--head);letter-spacing:-3px;margin:40px 0 0 52px}
.lb.cv .sub{font:400 24px/1.35 var(--text);margin:26px 0 0 56px;max-width:620px}
.lb.cv .ev{position:absolute;top:56px;right:56px;text-align:right;font:400 14px/1.4 var(--text);color:var(--slate)}
.lb.cv .bot{position:absolute;left:56px;right:56px;bottom:40px;display:flex;align-items:flex-end;gap:28px}
.lb.cv .who{display:flex;gap:28px;font:400 14px/1.35 var(--text);color:var(--slate);flex:1}
.lb.cv .who b{display:block;font:600 16px/1.3 var(--head);color:var(--ink)}
.lb.cv .fam{display:flex;gap:14px}
.lb.cv .fam .pic{width:104px;height:104px;border:0;background:var(--mist);margin:0}
.lb.cv .note{position:absolute;right:56px;bottom:14px;font:400 12px/1.3 var(--text);color:var(--slate)}


/* ==================== v9 slides 3 and 7 (22 Oct): the ten futures, their own way, then with the plan ====================
   One picture, drawn twice in the same place: slide 3 (their own way) marks where the flat is sold and where the money
   still runs out; slide 7 (the plan) redraws ten typical futures, all reaching 89, with slide 3's sale marks left as
   hollow ghosts. The model gives x = (year - 2026) / 40; the plot shows only the window 2051-2066 (Carmen 74 to 89,
   Pete 22 Oct: "the thing we're focusing on is just the 2056-2066 part"), so x is re-mapped with --y0 (years from 2026
   to the window's start) and --yn (the window's length); the lines fade in from the left, and make_looks.py fails if
   any event falls before the window. The accent is the title's claim: on 3 the sale and what it leaves the children;
   on 7 the futures that reach 89. */
.c9{--text:"Plus Jakarta Sans",Arial,sans-serif}
.c9 .pn>h3{font-size:20px;margin-bottom:0}
.c9 .bar{font-size:20px;margin-top:18px}
.c9 .ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.c9 .lede{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:8px}
.c9 .body{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding-top:16px}
/* the plot: a band for Carmen's years alone, the goal line at 89, ten rows, the sale bracket, the axis */
.f9{--y0:25;--yn:15;position:relative;margin-right:28px;padding-top:26px}
.f9 .alone{position:absolute;top:0;bottom:0;left:calc((30 - var(--y0)) / var(--yn) * 100%);right:0;background:var(--mist)}
.f9 .brk>span.from{left:0;transform:none;font-weight:400;color:var(--slate)}   /* the crop, said where the axis starts */
.f9 .alone span{position:absolute;top:7px;left:10px;font:400 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.f9 .goal{position:absolute;top:0;bottom:0;left:100%;border-left:1.5px dashed var(--ink)}
.f9 .goal span{position:absolute;top:7px;right:8px;font:600 14px/1 var(--text);white-space:nowrap}
.f9 .rows{position:relative;display:flex;flex-direction:column;gap:7px;padding:8px 0 10px}
.f9r{position:relative;height:17px}
.f9r .ln{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn));background:linear-gradient(to right,rgba(160,160,160,0),var(--grey) 56px)}
.f9r .end{position:absolute;top:50%;left:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn));width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.f9r .end .ic{width:12px;height:12px;stroke-width:3.2}
.f9r.short .end{background:var(--ink);color:#fff}
.f9r.short .end .v,.f9r.sold .end .x,.f9r.kept .end .x,.f9r.lasts .end .x{display:none}
.f9r.sold .end,.f9r.kept .end,.f9r.lasts .end{background:var(--paper);border:2px solid var(--ink);color:var(--ink)}
.f9r .hs{position:absolute;top:50%;left:calc((var(--s) * 40 - var(--y0) * 100%) / var(--yn));width:26px;height:26px;margin:-13px 0 0 -13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
.f9r .hs .ic{width:16px;height:16px;stroke-width:2.4}
.f9r.kept .hs{display:none}
/* slide 3: the crosses' label, attached to the lowest one: what the late sale buys */
.f9r .tl{position:absolute;top:50%;left:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn) + 18px);transform:translateY(-50%);font:600 14px/1 var(--text);color:var(--ink);white-space:nowrap;z-index:2}
.f9r:not(.short) .tl{display:none}

/* ==================== v9 slide 6, Call 2 (22 Oct): what they own -> what each becomes -> what it achieves ============
   Option B "Put to work" (Pete, 20 Oct), set against their own way (slide 3). Rows run across the first two columns so
   each asset sits beside its decision; rows are ranked by what moves the odds (the home first, the tallest, the only
   large number), and the business row says what really changes (both ways sell it; ours is planned and counted low).
   The third column reads top to bottom, their own way (grey) to decided now (the accent, the title's claim). */
.k9{display:grid;grid-template-columns:378.67px 479.33px;column-gap:24px;grid-template-rows:auto 1fr;min-height:0}
.k9>h3{font:600 20px/1.25 var(--head);padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.k9 .rws{grid-column:1 / -1;display:flex;flex-direction:column;min-height:0;padding-top:4px}
.k9 .rw{display:grid;grid-template-columns:378.67px 479.33px;column-gap:24px;align-items:center;border-bottom:1px solid var(--rule);flex:1}
.k9 .rw:last-child{border-bottom:0}
.k9 .rw.big{flex:1.45}
.k9 .own b{display:block;font:600 16px/1.3 var(--text)}
.k9 .own .tr{display:flex;align-items:center;gap:10px;margin-top:8px}
.k9 .own .tr i{display:block;height:14px;background:var(--grey)}
.k9 .own .tr span{font:600 16px/1 var(--text);white-space:nowrap}
.k9 .own .fl{font:400 16px/1.3 var(--text);color:var(--slate);margin-top:6px}
.k9 .to{position:relative;padding-left:34px}
.k9 .to>.ic{position:absolute;left:0;top:50%;width:22px;height:22px;margin-top:-11px;color:var(--ink);stroke-width:2.4}
.k9 .to b{display:block;font:600 16px/1.3 var(--text)}
.k9 .to p{font:400 14px/1.38 var(--text);color:var(--slate);margin-top:2px}
.k9 .to .n{display:flex;align-items:baseline;gap:10px}
.k9 .to .n strong{font:700 40px/1 var(--head)}
.k9 .to .n span{font:600 16px/1.3 var(--text)}
/* the third column: their own way and decided now as two bars on one scale (0 to 100%), grey then the accent */
.k9b{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-top:16px;min-height:0}
.k9b .cap9{font:400 14px/1.35 var(--text);color:var(--slate)}
.k9b .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.k9b .tk{position:relative;height:236px;border-bottom:1.5px solid var(--ink)}
.k9b .tk i{position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--grey)}
.k9b .tk strong{position:absolute;left:0;bottom:calc(var(--h) + 8px);font:700 40px/1 var(--head);color:var(--grey)}
.k9b .now .tk i{background:var(--accent)}
.k9b .now .tk strong{font-size:72px;color:var(--accent);letter-spacing:-1px}
.k9b .c p{font:600 16px/1.3 var(--text);margin-top:8px}
.k9b .c p span{display:block;font:400 14px/1.35 var(--text);color:var(--slate)}
/* slide 7: every line reaches 89, its tick in the accent; slide 3's sales stay as hollow grey ghosts */
.f9.won .f9r .ln{background:linear-gradient(to right,rgba(18,18,18,0),var(--ink) 56px)}   /* ink lines: a wall of crimson read as alarm (23 Oct) */
.f9.won .f9r.lasts .end{background:var(--accent);border-color:var(--accent);color:#fff}   /* the title's claim: every future reaches 89 */
.f9r .gh{position:absolute;top:50%;left:calc((var(--s) * 40 - var(--y0) * 100%) / var(--yn));width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px dashed var(--grey);background:var(--paper);color:var(--grey);display:flex;align-items:center;justify-content:center;z-index:3}
.f9r .gh .ic{width:15px;height:15px;stroke-width:2}
.f9r.g-kept .gh{display:none}
/* the bracket under the sale marks, its label attached */
.f9 .brk{position:relative;height:34px}
.f9 .brk>i{position:absolute;top:0;height:10px;border:2px solid var(--accent);border-top:0}
.f9 .brk>span{position:absolute;top:16px;transform:translateX(-50%);font:600 14px/1 var(--text);color:var(--accent-deep);white-space:nowrap}
.f9.won .brk>i{border-color:var(--grey)}
.f9.won .brk>span{color:var(--slate);font-weight:400}
.f9 .brk>span.ra{transform:translateX(-100%)}   /* right-aligned to the bracket's end, clear of the 89 line */
.f9ax{position:relative;height:40px;margin-right:28px;border-top:1.5px solid var(--ink)}
.f9ax span{position:absolute;top:7px;transform:translateX(-50%);font:600 14px/1.25 var(--text);white-space:nowrap;text-align:center}
.f9ax span:first-child{transform:none;text-align:left}
.f9ax span:last-child{transform:translateX(-100%);text-align:right}
.f9ax span i{display:block;font-style:normal;font-weight:400;color:var(--slate)}
/* slide 3, right: the home, then what the children are left */
.c9 .home{height:136px;background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:400 14px/1.3 var(--text);color:var(--slate);text-align:center}
.c9 .home .ic{width:44px;height:44px;stroke-width:1.4;color:var(--ink)}
.c9 .homec{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:8px}
.x3-62{display:flex;align-items:baseline;gap:12px;padding-top:12px;border-top:1px solid var(--rule)}
.x3-62 strong{font:700 40px/1 var(--head)}
.x3-62 p{font:400 14px/1.35 var(--text);color:var(--slate)}
.c9 .inh .l{font:600 16px/1.3 var(--text)}
.c9 .inh strong{display:block;font:700 72px/1 var(--head);color:var(--accent);margin:8px 0 6px;letter-spacing:-1px}
.c9 .inh p.s{font:400 14px/1.35 var(--text);color:var(--slate)}
/* slide 7, right: the premium line (series.py), the review's result, the rules */
.c9 .pc{position:relative;height:150px;margin:22px 0 0 44px}
.c9 .pc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.c9 .pc .gl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.c9 .pc .gl span{position:absolute;right:calc(100% + 8px);top:-8px;font:400 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.c9 .pc .sw{position:absolute;top:-24px;bottom:0;border-left:1.5px solid var(--ink)}
.c9 .pc .sw span{position:absolute;top:0;right:8px;font:600 14px/1.25 var(--text);white-space:nowrap;text-align:right}
.c9 .pc .pk{position:absolute;transform:translateY(-30%);padding-left:12px;white-space:nowrap}
.c9 .pc .en{position:absolute;right:0;transform:translateY(-130%);font:600 14px/1 var(--text);white-space:nowrap}
.c9 .pc .pk b{display:block;font:700 20px/1 var(--head)}
.c9 .pc .pk span{display:block;font:400 14px/1.3 var(--text);color:var(--slate)}
.c9 .pcx{position:relative;height:22px;margin-left:44px;border-top:1.5px solid var(--ink)}
.c9 .pcx span{position:absolute;top:5px;transform:translateX(-50%);font:400 14px/1 var(--text);color:var(--slate)}
.c9 .pcx span:first-child{transform:none}.c9 .pcx span:last-child{transform:translateX(-100%)}

/* ==================== v9 slide 2 (23 Oct): four people, four wants, and on paper secure ====================
   Stacked: the four people across the slide (each want returns later as a call), then the strength as one band, the
   net worth in the accent: the title's claim. */
.x2{flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:20px;min-height:0}
.x2 h3{font:600 20px/1.25 var(--head);padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.x2-pp{display:grid;grid-template-columns:repeat(4,1fr);column-gap:24px;margin-top:18px}
.x2-pp .pic{width:150px;height:150px;border:0;background:var(--mist);margin:0 0 14px}
.x2-pp h4{font:600 20px/1.2 var(--head)}
.x2-pp .r{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:2px}
.x2-pp .w{font:400 16px/1.4 var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.x2-st{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;margin-top:18px;align-items:end}
.x2-st>div{display:flex;align-items:baseline;gap:12px}
.x2-st strong{font:700 40px/1 var(--head)}
.x2-st strong.on{font-size:72px;color:var(--accent);letter-spacing:-1px}
.x2-st p{font:400 16px/1.35 var(--text);color:var(--slate)}

/* ==================== v9 slide 4 (23 Oct): the answer, as the map the call slides expand ====================
   The family's own words, then the five calls in the order the talk takes them (the numbers match the tracker), then
   the impact band: their own way in grey, the plan's result in the accent, the only accent on the slide. */
.x4{flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:20px;min-height:0}
.x4-q{border-left:4px solid var(--ink);padding:4px 0 4px 16px}
.x4-q p{font:600 22px/1.3 var(--head)}
.x4-q span{display:block;font:400 14px/1.3 var(--text);color:var(--slate);margin-top:4px}
.x4-c{display:grid;grid-template-columns:repeat(5,1fr);column-gap:24px}
.x4-c>div{border-top:1.5px solid var(--ink);padding-top:14px}
.x4-c .t{display:flex;align-items:center;gap:10px}
.x4-c .t i{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--ink);color:#fff;font:700 16px/1 var(--head);font-style:normal}
.x4-c .t .ic{width:26px;height:26px;stroke-width:1.8;color:var(--ink);fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.x4-c h4{font:600 20px/1.2 var(--head);margin-top:12px;min-height:48px}
.x4-c p{font:400 14px/1.4 var(--text);color:var(--slate);margin-top:6px}
.x4-i{display:flex;align-items:flex-end;gap:28px;padding-top:16px;border-top:3px solid var(--ink)}
.x4-i .l{font:600 16px/1.3 var(--text);max-width:170px;padding-bottom:8px}
.x4-i .v{display:flex;align-items:baseline;gap:10px}
.x4-i .v strong{font:700 40px/1 var(--head);color:var(--grey)}
.x4-i .v span{font:400 16px/1.3 var(--text);color:var(--slate)}
.x4-i .v.on strong{font-size:72px;color:var(--accent);letter-spacing:-1px}
.x4-i .v.on span{color:var(--ink);font-weight:600}
.x4-i .ar{font:400 40px/1 var(--text);color:var(--grey);padding-bottom:10px}
.x4-i .h{font:400 16px/1.35 var(--text);color:var(--slate);margin-left:auto;max-width:250px;padding-bottom:8px;text-align:right}

/* ==================== v9 slide 5, Call 1 (23 Oct): the gap, what closes it, the papers ====================
   Panel 1: pay that continues if a parent can't work, today (nothing, a dashed empty bar) against with cover (ink
   bars, Adrian's HK$65K a month = the full track). Panel 2: the year-1 cost as one stacked bar and the one large
   number in the accent (the title's claim). Panel 3: the papers in month one, as a checklist. */
.x5-p{flex:1;display:flex;flex-direction:column;justify-content:space-around}

/* ==================== slide 6, Call 2 (24 Oct): four decisions, one row each, and the odds they buy ====================
   A way in: three column labels (what they own and spend / what each becomes / what it gives them). Four rows, one per
   decision, so "four decisions" can be counted; ribbons never cross. Each row is one band (24 Oct, Pete: the left and
   middle were not aligned, too many icons): the asset's grey bar, to scale, starts its own ribbon, and the left and
   middle labels sit above the line in the same metrics, so their lines align. Icons back the same day (Pete), as
   circles beside the left labels. The destinations are quiet (mist, a wine rule, ink
   numbers): the only accent is the result. The result is a bar on one scale: their own way, then four decisions in
   crimson, then a dashed stretch to Call 3, so the slide shows what is left for the next one. (23 Oct: a wine income
   box outweighed the result, the budget floated in a dashed box, and the band only restated the title.)
   Geometry: the flow box is 1184 x 274; rows at y 56, 120, 184, 248. */
.f6h{flex:none;position:relative;height:20px;margin-top:14px;font:700 14px/1 var(--text);color:var(--slate);letter-spacing:.2px}

.e9{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr;column-gap:56px;margin-top:18px;padding-bottom:10px}

  background:var(--mist);border-left:1.5px dashed var(--grey);border-right:1.5px dashed var(--grey)}

.e9k{margin-top:0}

.e9 .e9gr{font-size:15px}
.e9 .e9gr b{font-size:16px}
.e9 .e9o p b{font-size:16px}
.e9 .e9band span i.tag{font-style:italic}
.e9v .e9an{position:absolute;left:0;top:0;width:112px;margin:0;font:600 14px/1.3 var(--text);color:var(--wine)}   /* the note sits in the space above the first column */
.e9v .e9an i{font-weight:400;color:var(--ink)}
/* slide 9, 24 Oct rework (Pete: the right side missed that Ryan's crypto is kept and shrinks as he saves; the left should
   mark the growth and say why each fund, why these sizes, and the risk): the growth as one arrow; "like for like" as the
   financial answer; each fund's role keyed to its segment; Ryan's wealth as three columns on one scale, the crypto block
   the same size in each, so only the share falls */
.e9 .e9bars{padding-top:34px;gap:22px}
.e9 i.g{position:relative}
.e9 i.g b{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 16px/1 var(--text);color:var(--ink)}
/* the key: what the 25% is made of, in the segments' own colours, one row */
.e9w{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.e9w li{display:flex;gap:8px;align-items:flex-start}
.e9w li>i{flex:none;width:14px;height:14px;margin-top:3px}
.e9w p{display:grid;grid-template-columns:146px 82px 1fr;font:400 15px/1.35 var(--text);color:var(--ink)}
.e9w p span{font-weight:400;color:var(--ink)}
.e9w p b{font:600 16px/1.3 var(--text);color:var(--ink)}
/* the claim: a heading a step below the panel's, then its reason in one quiet sentence */
.e9lk{margin:16px 0 14px;padding-top:12px;border-top:1px solid var(--rule)}
.e9lk h4{font:700 16px/1.3 var(--text);color:var(--ink)}
.e9lk p{font:400 15px/1.45 var(--text);color:var(--ink);margin-top:4px}
.e9lk p b{font-weight:700}
.e9y .tx p b{font-weight:700;color:var(--ink)}
.e9o{display:grid;grid-template-columns:repeat(3,1fr);column-gap:14px;margin-top:12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.e9o>div{display:flex;gap:10px;align-items:flex-start}
.e9o .pic,.e9y .pic{flex:none;width:38px;height:38px;margin:0;border:0;background:var(--mist);box-shadow:var(--lift)}
.e9o p{font:400 15px/1.3 var(--text);color:var(--ink)}
.e9o p b{display:block;font:600 15px/1.25 var(--text);color:var(--ink)}
.e9y{flex:1;min-height:0;display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;column-gap:22px;row-gap:14px;align-items:end;padding:10px 0 8px}
.e9y>.nm{grid-column:1/3;display:flex;align-items:center;gap:10px;align-self:start}
.e9y>.nm b{font:700 16px/1.25 var(--text);color:var(--ink)}
.e9y .tx{align-self:center}
.e9y .tx p{font:400 15px/1.45 var(--text);color:var(--ink);margin-top:10px}
.e9y .tx p b{color:var(--ink);font-weight:700}
.e9y .tx .nm{display:flex;align-items:center;gap:10px;margin-top:0}
.e9y .tx .nm b{font:700 16px/1.25 var(--text)}
.e9v{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:22px}
.e9v .cl{display:flex;flex-direction:column;align-items:center;width:92px}
.e9v .cl em{font:700 22px/1 var(--head);font-style:normal;color:var(--ink);margin-bottom:6px;letter-spacing:-.3px}
.e9v .cl.on em{font-size:34px;color:var(--accent);letter-spacing:-1px}
.e9v .st{display:flex;flex-direction:column;width:92px}
.e9v .st i{display:block;width:100%;position:relative}
.e9v .cr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--text);color:#fff;white-space:nowrap}
.e9v .rs{background:var(--rose-g)}
.e9v .cr{background:var(--wine-g)}
.e9v .cl.on .cr{background:var(--accent-g)}
.e9v .cl>span{font:400 14px/1.2 var(--text);color:var(--ink);margin-top:6px;white-space:nowrap}
.e9v::before{content:"";position:absolute;left:0;right:0;bottom:calc(20px + var(--cr));border-top:1.5px dashed var(--ink);z-index:1}   /* the crypto block's top, flat across the columns */
.e9v .lv{position:absolute;right:0;bottom:calc(20px + var(--cr) - 18px);width:116px;font:400 14px/1.3 var(--text);color:var(--ink)}
.e9v .lv b{display:block;font:600 14px/1.3 var(--text);color:var(--ink)}

/* ==================== the presentation system, after Pete's own decks (23 Oct) ====================
   Taken from Banyan and Nordea only where a planner would use it (Pete: "take the good parts ... where it is
   reasonable"): a heading hierarchy (bold sans heading on a rule, a one-line lede, content); a plain reading under a
   chart that needs one (.tk9); one dashed ring on the moment that matters; icons that name a real thing, neutral
   except the focal row's; a quiet section tracker in the footer. Not taken: chevrons, numbered discs with no legend,
   lightbulbs, a crimson punch-line restating the title. */
/* the header as in e-Sentry (24 Oct, Pete): a 5 px crimson rule on the title block, kicker and title 14 px in from it,
   a smaller header (kicker 14, title 29 bold) and panel headings at 17 semibold, so no heading competes with the title.
   (Before: a 7 px rail at the slide's edge, a 33 px semibold title and 19 px bold panel headings that out-weighed it.)
   The header is the positioning box, so the house icon is placed from it. */
.c9 .hd{position:relative;border-left:5px solid var(--accent);padding:1px 0 2px 14px}
.c9 .pn>h3,.lb .x2 h3{font:600 17px/1.25 var(--text);letter-spacing:-.1px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.c9 .lede{font:400 15px/1.4 var(--text);color:var(--slate);margin-top:8px}
.c9 .lede b{color:var(--ink);font-weight:600}
.tk9{border:1.5px dashed var(--grey);padding:10px 16px;font:400 16px/1.4 var(--text);text-align:center;background:var(--paper);margin-top:6px}
.tk9 b{font-weight:700}
.tk9 em{font-style:italic;font-weight:700;color:var(--accent)}
.ic9{flex:none;width:46px;height:46px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ic9 .ic{width:24px;height:24px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.ring{position:absolute;border:2px dashed var(--accent);border-radius:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none}
/* the footer: source left, the section tracker, the page */
.ft{gap:24px}
.ft .src{flex:1;max-width:640px}
.ft .nv{margin-left:auto;display:flex;gap:22px;font:400 13px/1 var(--text);color:var(--grey);white-space:nowrap}
.ft .nv b{color:var(--ink);font-weight:600}
/* slide 3, right: three icon rows, one focal number */
.x3r{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:0}
.x3r>.x3w{margin-top:auto}   /* the why sits on the panel's floor, level with the left reading */
.x3w{background:var(--mist);padding:10px 16px}
/* the trade-off (23 Oct): on every call slide, what the family gives up, from the written case; a mist strip on the
   conclusion bar, so benefit and cost read together. A planner says the cost before the client asks. */
/* 25 Oct (Pete: slides 5, 9, 10's presentation): each trade-off as its content's last line, the label in wine */
.s5pr,.e9pr,.q10pr{font:400 14px/1.4 var(--text);color:var(--ink)}
.s5pr b,.e9pr b,.q10pr b{font-weight:700;color:var(--ink)}
.s5pr{margin-top:18px;padding:10px 14px;background:var(--mist);font-size:15px}
.s5q{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule);font:400 15px/1.45 var(--text);color:var(--ink)}
.s5q b{font-weight:700}
.e9pr{margin-top:8px}
.q10pr{margin-top:12px;padding:10px 14px;background:var(--mist);font-size:15px}
.q10pr strong{font-weight:700}
.tr9{flex:none;display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 18px;background:var(--mist);font:400 15px/1.35 var(--text);color:var(--slate)}
.tr9 b{flex:none;color:var(--ink);font-weight:600}
.tr9 .ic{flex:none;width:20px;height:20px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.c9 .tr9+.bar{margin-top:0}
.x3w h4{font:600 15px/1.3 var(--text);color:var(--ink);margin-bottom:4px}
.x3w p{font:400 15px/1.4 var(--text);color:var(--slate)}
.x3w p+p{margin-top:6px}
.x3w p b{color:var(--ink);font-weight:600}
/* slide 3, right (24 Oct, Pete: the right side conflicted for attention): one focal point, what Ryan and Chloe
   inherit, drawn against today's net worth on one scale; the two odds as small supporting rows; the causes as a quiet
   note. (Before: five numbers of near-equal weight, three icon circles, three bold leads and a shaded box.) */
.x3p .body{flex:1;display:flex;flex-direction:column}
.x3q{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-top:4px}   /* three groups, equal gaps */
.x3p .sm{display:grid;grid-template-columns:20px 70px 1fr;column-gap:12px;align-items:center;padding:5px 0}
.x3p .sm .ic,.x3p .k .ic{width:20px;height:20px;stroke:var(--slate);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.x3p .sm strong{font:700 28px/1 var(--head);color:var(--ink);letter-spacing:-.5px}
.x3p .sm p{font:400 14px/1.35 var(--text);color:var(--slate)}
.x3p .hero{padding-top:14px;border-top:1px solid var(--rule)}   /* each group opens on a thin rule */
.x3p .k{display:flex;align-items:center;gap:10px;font:600 16px/1.3 var(--text);color:var(--ink)}
.x3p .hb{display:grid;grid-template-columns:100px 1fr;column-gap:12px;align-items:center;margin-top:16px}
.x3p .hb>span{font:400 15px/1.25 var(--text);color:var(--slate)}
.x3p .hb .t{display:flex;align-items:center;min-width:0}
.x3p .hb i{display:block;height:38px;flex:none}
.x3p .hb i.g{background:var(--rose-g);display:flex;align-items:center;justify-content:flex-end;padding-right:10px}
.x3p .hb i.g b{font:700 16px/1 var(--text);color:var(--ink)}
.x3p .hb.on i{background:var(--accent-g)}
.x3p .hb.on strong{font:700 60px/1 var(--head);color:var(--accent);margin-left:14px;letter-spacing:-2px}
.x3p .why{padding-top:14px;border-top:1px solid var(--rule)}
.x3p .why h4{font:600 14px/1.3 var(--text);color:var(--slate);margin-bottom:8px}
.x3p .why .wc{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.x3p .why p{font:400 14px/1.35 var(--text);color:var(--slate)}
.x3p .why p b{display:block;font:700 22px/1.1 var(--head);color:var(--ink);margin-bottom:4px;letter-spacing:-.3px}
/* slide 3, right, pass 3 (24 Oct, Pete: still conflicting, it took time to understand): only what is said, in the
   order it is said. The share of futures that sell the home as 100 houses (series.py, from own_sold_pct), the sold
   ones filled; then what the children inherit. 62% (slide 4's baseline) and the two causes (fixed on slides 6 and 7)
   moved to the notes: on screen they were read while something else was being said. */
.x3q{justify-content:flex-start;gap:0}
.x3p .sold .k{display:flex;align-items:baseline;gap:10px;font:600 16px/1.3 var(--text);color:var(--ink)}
.x3p .sold .k strong{font:700 48px/1 var(--head);color:var(--ink);letter-spacing:-1.5px}
/* 24 Oct, fourth pass (Pete: do we need the big house chart?): the 100 houses said 51% a second time, in the slide's
   largest mass of crimson; one split bar shows the same half in a line, sold in wine, kept in rose */
.x3v{display:flex;height:38px;margin-top:14px;border-radius:0 6px 6px 0;overflow:hidden;background:var(--rose-g);box-shadow:var(--lift)}
.x3v i{display:flex;align-items:center;padding-left:12px;background:var(--wine-g);color:#fff;font:600 15px/1 var(--text);font-style:normal}
.x3v span{margin-left:auto;align-self:center;padding-right:12px;font:600 15px/1 var(--text);color:var(--slate)}
/* the chart's events, as e-Sentry marks them: a dot on the data, a leader up into white space, the label at its top */
.sx .x3k{position:absolute;width:0;border-left:1.5px solid var(--ink);z-index:4;margin:0}
.sx .x3k::after{content:"";position:absolute;left:-7px;bottom:-6px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(60,10,20,.35)}
.sx .x3k span{position:absolute;top:0;right:8px;width:max-content;font:400 14px/1.3 var(--text);color:var(--slate);white-space:nowrap;text-align:right}
.sx .x3k b{font-weight:700;color:var(--ink)}
.x3p .sold .s{font:400 15px/1.35 var(--text);color:var(--slate);margin-top:10px}
.x3p .hero{margin-top:26px;padding-top:22px}
/* slide 7: the same result rows as slide 3, at the foot of the premium panel */
.x3r .row.nn{grid-template-columns:46px 1fr}
.x3r .row{display:grid;grid-template-columns:46px 112px 1fr;column-gap:12px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.x3r .row strong{font:600 34px/1 var(--head)}
.x3r .row.on{grid-template-columns:46px 1fr;row-gap:6px}
.x3r .row.on .ic9{grid-row:1/3}
.x3r .row.on strong{font-size:46px;color:var(--accent)}
.x3r .row.on p{grid-column:2}
.x3r .row:not(.on) .ic9{background:var(--mist);color:var(--slate)}   /* one focal row: only the inheritance is crimson */
.x3r .row p{font:400 15px/1.35 var(--text);color:var(--slate)}
.x3r .row p b{color:var(--ink);font-weight:600}

/* 24 Oct (Pete: look at the spacing of the title): one gap under every title, whatever the body below it. Each slide
   had set its own (14 to 22 px), and the tight ones put the content against the title. */
.c9 .hd+*{margin-top:26px}

/* depth on objects only (24 Oct, Pete: shadows where they apply): one soft, wine-tinted lift for things the viewer
   should read as objects (portraits, slide 6's results, slide 8's planned pots, the conclusion bar). Nothing drawn to a
   scale gets one: a shadow moves an edge, so a bar or an area would read longer or thicker than its value. */
.lb{--lift:0 6px 18px rgba(90,21,32,.14),0 1px 3px rgba(90,21,32,.10)}
.r2p .pic,.x5-p .who .pic,.e9q .pic,.b8 .st .pic{box-shadow:var(--lift)}
.b8 .p .bk .pic{box-shadow:0 2px 6px rgba(0,0,0,.25)}
.f6 .dst{box-shadow:var(--lift)}
.b8 .p .bk>div{box-shadow:var(--lift)}
.bar{box-shadow:0 8px 22px rgba(90,21,32,.20)}

/* ---- a portrait: a circle that crops its image (the cover's family; later the people on 2 and 14) ---- */
.pic{display:block;width:160px;height:160px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink);background:#fff;margin-bottom:10px}
.pic img{width:100%;height:100%;object-fit:cover}

/* ---- a slide still to build: its title and the picture the plan asks for (plan §5) ---- */
.todo-box{flex:1;margin-top:22px;border:1.5px dashed var(--grey);display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:10px;padding:24px;text-align:center}
.todo-box b{font:600 20px/1.2 var(--head);color:var(--slate)}
.todo-box p{font:400 16px/1.4 var(--text);color:var(--slate);max-width:760px}

/* ---- builds: data-b="n" is the step an element is spoken in. make.py --builds repeats a slide once per step with
   class upto-k; later steps stay on the page in grey (Pete, 23 Oct: keep the context, don't remove it), so the layout
   never moves and the eye goes to what is in colour ---- */
.upto-1 [data-b="2"],.upto-1 [data-b="3"],.upto-1 [data-b="4"],.upto-1 [data-b="5"],.upto-1 [data-b="6"],.upto-1 [data-b="7"],.upto-1 [data-b="8"],.upto-1 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-2 [data-b="3"],.upto-2 [data-b="4"],.upto-2 [data-b="5"],.upto-2 [data-b="6"],.upto-2 [data-b="7"],.upto-2 [data-b="8"],.upto-2 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-3 [data-b="4"],.upto-3 [data-b="5"],.upto-3 [data-b="6"],.upto-3 [data-b="7"],.upto-3 [data-b="8"],.upto-3 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-4 [data-b="5"],.upto-4 [data-b="6"],.upto-4 [data-b="7"],.upto-4 [data-b="8"],.upto-4 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-5 [data-b="6"],.upto-5 [data-b="7"],.upto-5 [data-b="8"],.upto-5 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-6 [data-b="7"],.upto-6 [data-b="8"],.upto-6 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-7 [data-b="8"],.upto-7 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-8 [data-b="9"]{filter:grayscale(1);opacity:.3}
/* the ten-futures slides (3, 7) reveal instead: greyed, their payoff showed before it was spoken (Pete, 23 Oct) */
.reveal.upto-1 [data-b="2"],.reveal.upto-1 [data-b="3"],.reveal.upto-1 [data-b="4"],.reveal.upto-1 [data-b="5"],.reveal.upto-1 [data-b="6"],.reveal.upto-1 [data-b="7"],.reveal.upto-1 [data-b="8"],.reveal.upto-1 [data-b="9"]{visibility:hidden}
.reveal.upto-2 [data-b="3"],.reveal.upto-2 [data-b="4"],.reveal.upto-2 [data-b="5"],.reveal.upto-2 [data-b="6"],.reveal.upto-2 [data-b="7"],.reveal.upto-2 [data-b="8"],.reveal.upto-2 [data-b="9"]{visibility:hidden}
.reveal.upto-3 [data-b="4"],.reveal.upto-3 [data-b="5"],.reveal.upto-3 [data-b="6"],.reveal.upto-3 [data-b="7"],.reveal.upto-3 [data-b="8"],.reveal.upto-3 [data-b="9"]{visibility:hidden}
.reveal.upto-4 [data-b="5"],.reveal.upto-4 [data-b="6"],.reveal.upto-4 [data-b="7"],.reveal.upto-4 [data-b="8"],.reveal.upto-4 [data-b="9"]{visibility:hidden}
.reveal.upto-5 [data-b="6"],.reveal.upto-5 [data-b="7"],.reveal.upto-5 [data-b="8"],.reveal.upto-5 [data-b="9"]{visibility:hidden}
.reveal.upto-6 [data-b="7"],.reveal.upto-6 [data-b="8"],.reveal.upto-6 [data-b="9"]{visibility:hidden}
.reveal.upto-7 [data-b="8"],.reveal.upto-7 [data-b="9"]{visibility:hidden}
.reveal.upto-8 [data-b="9"]{visibility:hidden}
.notes{display:none}
/* ==================== slides 10 to 15, drafted fresh (24 Oct) ==================== */
/* the icon in a soft circle, beside a bold claim and its detail (slides 10 and 12) */
.q10m,.q12m{display:flex;flex-direction:column;margin-top:10px}
.q12m{flex:1}
.q10m li,.q12m li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule)}
.q10m li:last-child,.q12m li:last-child{border-bottom:0}
.q10m .ci,.q12m .ci{flex:none;width:36px;height:36px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center}
.q10m .ci .ic,.q12m .ci .ic{width:19px;height:19px;stroke:var(--wine);stroke-width:2}
/* slide 10's risks as filled pictograms (Pete, 24 Oct: his picks, a briefcase, people, bitcoin, a leaf, a rising chart;
   drawn from Phosphor's filled set, MIT, since his files were stock previews in four colours): white on wine, as on
   slides 11 and 14 */
.q10m .ci{background:var(--wine-g);color:#fff;box-shadow:var(--lift)}
.q10m .ci .ic{width:20px;height:20px}
.q10m b,.q12m b{display:block;font:600 16px/1.3 var(--text);color:var(--ink)}
.q10m p,.q12m p{font:400 14px/1.35 var(--text);color:var(--ink);margin-top:1px}

/* slide 10: each hard test as one row, a dumbbell from the four decisions alone (hollow) to the full plan (filled) on
   one 0-100% scale, then what holds it. Only the title's test, the lost job, is crimson. */
.q10 .pn>h3{margin-bottom:0}
.q10k{display:inline-flex;align-items:center;gap:6px;margin-right:22px;white-space:nowrap}
.q10k i{display:inline-block;width:12px;height:12px;border-radius:50%}
.q10k i.o{background:#fff;border:2.5px solid var(--grey)}
.q10k i.p{background:var(--wine)}
.q10h,.q10r,.q10x{display:grid;grid-template-columns:216px 1fr 214px;column-gap:32px}
.q10h{margin-top:16px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);font:600 14px/1.2 var(--text);color:var(--slate)}
.q10x{margin-top:6px;font:400 14px/1 var(--text);color:var(--slate)}
.q10x .ax{position:relative;height:14px;margin-right:16px}
.q10x .ax i{position:absolute;top:0;font-style:normal;font-weight:400;transform:translateX(-50%)}
.q10x .ax i:nth-child(1){left:0;transform:none}.q10x .ax i:nth-child(2){left:50%}.q10x .ax i:nth-child(3){left:100%;transform:translateX(-100%)}
.q10c{flex:1;display:flex;flex-direction:column}
.q10r{flex:1;align-items:center;border-bottom:1px solid var(--rule);padding:4px 0}
.q10l b{display:block;font:600 16px/1.3 var(--text);color:var(--ink)}
.q10l span{display:block;font:400 14px/1.35 var(--text);color:var(--ink)}
/* each test as one rounded bar from 0% (Pete, 24 Oct: the arrows weren't premium): the four decisions alone in rose,
   then what the full plan adds in wine (crimson on the title's test), a white seam between; each value above its end */
.q10t{position:relative;height:60px;--bb:12px;margin-right:16px}   /* the scale ends short of the column, so a 99% label clears the next one */
.q10t::before{content:"";position:absolute;left:0;right:0;bottom:var(--bb);height:14px;border-radius:7px;background:var(--mist)}
.q10b{position:absolute;left:0;bottom:var(--bb);height:14px;border-radius:7px 0 0 7px;background:#E3C3C9}
.q10g{position:absolute;bottom:var(--bb);height:14px;border-radius:0 7px 7px 0;border-left:2px solid #fff;background:var(--wine-g)}
.q10r.on .q10g{background:var(--accent-g)}
.q10t i{position:absolute;bottom:calc(var(--bb) + 14px);width:0;height:0}
.q10t em{position:absolute;bottom:7px;left:0;transform:translateX(-50%);font-style:normal;white-space:nowrap}
.q10t i.o em{font:500 15px/1 var(--text);color:var(--slate)}
.q10t i.p em{font:700 24px/1 var(--head);color:var(--ink);letter-spacing:-.5px}
.q10r.on .q10t i.p em{font-size:36px;color:var(--accent);letter-spacing:-1px}
/* the sentence above the chart names the two parts with their own colours (a legend inside the sentence) */
.q10e .sw{display:inline-block;width:22px;height:10px;border-radius:5px;margin:0 7px 1px 2px;vertical-align:middle}
.q10e .sw.a{background:#E3C3C9}
.q10e .sw.p{background:var(--wine-g)}
.q10e b{color:var(--ink);font-weight:600}
/* what holds each test: one line a defence, its name in bold and what it does (Pete, 24 Oct: text, not pills; a list of
   names didn't say how, and full sentences were too busy for the column) */
.q10d{display:flex;flex-direction:column;gap:3px}
.q10d span{font:400 14px/1.35 var(--text);color:var(--ink);white-space:nowrap}
.q10d b{font-weight:600;color:var(--ink)}

/* slide 11: the first year as a staircase of deadlines (each bar ends on its month, on a 12-month track), then the dated
   steps on one line with an icon a step, then the reviews. */
.q11{flex:1;min-height:0;display:grid;grid-template-columns:repeat(9,1fr);column-gap:16px;align-content:start}
.q11 h3{font:600 17px/1.25 var(--text);padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.q11 h3.a{grid-column:1/5}
.q11 h3.b{grid-column:5/10}
/* the line through every step: crimson through this year, rose after; this year sits on a soft band, the zoom */
.q11 .tl{grid-column:1/10;position:relative;isolation:isolate;display:grid;grid-template-columns:subgrid;margin-top:18px;padding:22px 0 24px}
.q11 .tl::before{content:"";position:absolute;left:0;right:0;top:83px;border-top:2px solid var(--rose);z-index:-1}
.q11 .tl::after{content:"";position:absolute;left:-12px;top:0;bottom:0;width:calc((100% - 8 * 16px) * 4 / 9 + 3 * 16px + 24px);background:var(--mist);z-index:-2}
.q11 .st.now::after{content:"";position:absolute;left:0;right:-16px;top:61px;border-top:2px solid var(--accent);z-index:-1}   /* this year's stretch of the line, crimson */
.q11 .st.now:nth-child(4)::after{right:0}
.q11 .st{position:relative;display:flex;flex-direction:column}
/* who acts on each step (the written case's owners), as small overlapping portraits on one row */
.q11 .st .who{display:flex;margin-top:auto;padding-top:14px}
.q11 .st .who img{width:34px;height:34px;border-radius:50%;border:2px solid var(--paper);background:var(--mist);object-fit:cover;box-shadow:0 1px 3px rgba(90,21,32,.18)}
.q11 .st .who img+img{margin-left:-10px}
.q11 .st.now .who img{border-color:var(--mist)}
.q11 .st .y{display:block;font:700 21px/1.2 var(--head);color:var(--ink);white-space:nowrap;letter-spacing:-.3px}
.q11 .st.now .y{color:var(--accent)}
.q11 .st .ci{position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px;margin:10px 0 16px;border-radius:50%;background:var(--wine-g);box-shadow:0 0 0 4px var(--paper)}
.q11 .st.now .ci{background:var(--accent-g);box-shadow:0 0 0 4px var(--mist)}
.q11 .st .ci .ic{width:22px;height:22px;stroke:#fff;stroke-width:2}
.q11 .st b{display:block;font:600 16px/1.3 var(--text);color:var(--ink);padding-right:6px}
.q11 .st p{font:400 14px/1.4 var(--text);color:var(--slate);margin-top:4px;padding-right:6px}
.q11k{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.q11k h4{font:600 15px/1.3 var(--text);color:var(--slate)}
.q11k>div{display:grid;grid-template-columns:1.45fr 1fr 1.1fr;column-gap:24px;margin-top:6px}
.q11k span{font:400 14px/1.35 var(--text);color:var(--slate)}
.q11k span b{display:block;font:600 15px/1.3 var(--text);color:var(--ink)}
.q11r{flex:none;display:grid;grid-template-columns:auto .7fr 1.6fr 1.9fr;align-items:center;column-gap:26px;margin-top:16px;padding:12px 20px;background:var(--mist)}
.q11r>b{display:flex;align-items:center;gap:10px;font:600 16px/1.3 var(--text);color:var(--ink)}
.q11r>b .ic{width:20px;height:20px;stroke:var(--wine);stroke-width:2}
.q11r span{font:400 14px/1.35 var(--text);color:var(--slate)}
.q11r span b{display:block;font:600 15px/1.3 var(--text);color:var(--ink)}

/* slide 12: slide 3's inheritance bars redrawn on the same scale, the plan beside their own way; then how it passes on */
.q12b{display:flex;flex-direction:column;gap:18px;margin-top:26px}
.q12b .r{display:grid;grid-template-columns:118px 1fr;column-gap:14px;align-items:center}
.q12b .r>span{font:400 15px/1.25 var(--text);color:var(--slate)}
.q12b .r.on>span{color:var(--ink);font-weight:600}
.q12b .t{display:flex;align-items:center;min-width:0;height:72px}
.q12b i{display:block;height:40px;flex:none;background:#D3A6AD}
.q12b i.g{background:var(--rose-g);display:flex;align-items:center;justify-content:flex-end;padding-right:12px}
.q12b i.g b{font:700 17px/1 var(--text);color:var(--ink)}
.q12b strong{font:700 34px/1 var(--head);color:var(--slate);margin-left:14px;letter-spacing:-1px}
.q12b .on i{background:var(--accent-g)}
.q12b .on strong{font-size:72px;color:var(--accent);letter-spacing:-2px}
.q12n{margin-top:auto;padding:12px 16px;background:var(--mist);font:400 15px/1.4 var(--text);color:var(--slate)}
.q12n b{color:var(--ink);font-weight:600}
.q12s{position:relative;display:flex;justify-content:space-between;width:200px;margin:10px 0 2px}
.q12s::before{content:"";position:absolute;left:8px;right:8px;top:7px;border-top:2px solid var(--rose)}
.q12s span{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font:600 14px/1 var(--text);color:var(--ink)}
.q12s span::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--wine-g)}

/* slide 13: the scheme's growth in three facts, then the two flows across one boundary, drawn north up; each arrow carries
   one half of the title: Northbound dashed (kept out today), Southbound solid crimson (the market we want to serve) */
.q13f{flex:none;display:grid;grid-template-columns:repeat(3,1fr);column-gap:28px}
.q13f>div{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.q13f strong{flex:none;font:700 40px/1 var(--head);color:var(--ink);letter-spacing:-1px;white-space:nowrap}
.q13f span{font:400 15px/1.35 var(--text);color:var(--ink)}
/* slide 13's map (24 Oct, Pete: bland; a 3D map): the two flows either side of the Greater Bay Area, drawn from real
   boundaries (round2/gba_map.py); each side's heading carries its line, dashed for the Wongs, solid crimson for us */
.q13g{flex:1;min-height:0;display:grid;grid-template-columns:280px 1fr 280px;column-gap:12px;align-items:center;margin-top:6px}
.q13g .sd{align-self:start;padding-top:44px}   /* both sides start on one line, whatever their length */
.q13g .mp{position:relative;margin:0 -44px;z-index:0}   /* the map runs under the side columns: its edges are faint land fading out */
.q13g .sd{position:relative;z-index:1}
.q13g .mp img{display:block;width:100%;height:auto}
.q13g .lb{position:absolute;margin:0;transform:translate(-50%,-50%);font:600 15px/1.25 var(--text);color:var(--ink);white-space:nowrap;text-align:center;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:5px;box-shadow:0 1px 3px rgba(90,21,32,.14)}   /* a white backing, so labels read on the rose (24 Oct) */
.q13g .lb.l{transform:translate(0,-50%);text-align:left}
.q13g .lb.r{transform:translate(-100%,-50%);text-align:right}
.q13g .lb.hk{font-weight:700;color:var(--wine)}
.q13g .sd h4{display:flex;align-items:center;font:700 19px/1.25 var(--text);color:var(--ink);white-space:nowrap}
/* Northbound's leader runs along its heading to the column's edge, then curves to its flow: it never crosses the text */
.q13g .sd.n h4::after{content:"";flex:1;margin-left:12px;border-top:1.6px solid currentColor}
.q13g .sd.n h4{color:var(--wine)}
.q13g .sd.s h4{color:var(--accent)}
.q13g .pt{position:absolute;width:0;height:0}
svg.conn.q13c path{stroke-width:1.6}
.q13g .sd>p{font:400 15px/1.45 var(--text);color:var(--ink);margin-top:6px}
.q13g .sd>p b{font-weight:700;color:var(--ink)}   /* the phrase each paragraph turns on (Pete, 24 Oct) */
.q13g .sd h5{font:700 16px/1.3 var(--text);color:var(--wine);margin:16px 0 0;padding-top:12px;border-top:1px solid var(--rule)}
.q13g .sd.s h5{color:var(--accent)}


/* slide 14: one column a speaker, in speaking order: where, the goal in five years and its link, what this plan taught */
.q14{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);column-gap:24px}
.q14 .c{display:flex;flex-direction:column;border-top:3px solid var(--wine);padding-top:16px}
.q14 .who{display:flex;align-items:center;gap:14px}
/* the team's own photos (Pete, 25 Oct), circles large enough to read on video; Lookbua's role icon at the same size until
   his clean photo arrives (his first one showed a badge and a campus window) */
.q14 .who .ph{flex:none;width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid #fff;background:var(--mist);box-shadow:var(--lift)}
.q14 .who .ph img{display:block;width:100%;height:100%;object-fit:cover}
.q14 .who .ci{flex:none;width:76px;height:76px;border-radius:50%;background:var(--wine-g);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:var(--lift)}
.q14 .who .ci .ic{width:32px;height:32px;stroke:#fff;stroke-width:2}
.q14 .who b{display:block;font:700 20px/1.2 var(--head);color:var(--ink)}
.q14 .who span{font:400 15px/1.3 var(--text);color:var(--ink)}
.q14 .k{font:600 14px/1.3 var(--text);color:var(--wine);margin-top:18px}
.q14 h4{font:700 19px/1.3 var(--text);color:var(--ink);margin-top:4px}
.q14 .d{font:400 15px/1.45 var(--text);color:var(--ink);margin-top:8px}
.q14 .d b{font-weight:700}
.q14 .t{margin-top:auto;background:var(--mist);padding:16px 18px;min-height:150px}
.q14 .t .k{margin:0 0 4px}
.q14 .t p:not(.k){font:600 18px/1.4 var(--text);color:var(--ink);margin-top:2px}
.q14 .t.todo{background:none;border:1.5px dashed var(--grey)}
.q14 .t.todo p:not(.k){color:var(--slate);font-weight:400}

/* slide 15: the close mirrors the cover; where the cover had the family, the house built for them */
.q15 .l{padding-top:58px}
.q15 h1{font-size:112px;margin-top:40px}
.q15o{display:grid;grid-template-columns:repeat(3,1fr);column-gap:26px;margin-top:34px;max-width:700px}
.q15o div{border-top:2px solid var(--accent);padding-top:10px}
.q15o strong{display:block;font:700 40px/1 var(--head);color:var(--ink);letter-spacing:-1px}
.q15o span{display:block;font:400 14px/1.35 var(--text);color:var(--slate);margin-top:6px}
.q15t{position:absolute;left:56px;bottom:108px;font:600 34px/1.2 var(--head);color:var(--accent-deep)}
.q15s{position:absolute;left:56px;bottom:16px;font:400 12px/1.3 var(--text);color:var(--slate)}
.q15 .r{width:560px;padding:0 30px 0 34px}
.q15w{position:relative;display:grid;grid-template-columns:290px 1fr;column-gap:18px}
.q15h svg{display:block;width:100%;height:100%;overflow:visible}
.q15h .hx ellipse{opacity:.28}
.q15p{position:relative}
.q15p p{position:absolute;left:0;transform:translateY(-50%);font:400 14px/1.3 var(--text);color:#E8C6CB;white-space:nowrap}
.q15p p b{display:block;font:600 16px/1.25 var(--head);color:#fff}
/* slide 7 (24 Oct, Fahtai's rework): the savings split by what keeps them (the four decisions alone, darker; added by
   call 3, lighter); slide 3's events as numbered marks keyed in white space; what is left at 89 in a gutter; the
   premium chart named in plain words; the spending rules as rules; the odds in four blocks, the 97% raised.
   Classes prefixed x7 so they restyle nothing else. */
.c9 .x7s{height:300px;margin-top:22px}
.c9 .x7s,.c9 .x7a{margin-right:118px}
.x7g{position:absolute;left:100%;top:0;bottom:0;width:118px}
.x7g .h{position:absolute;left:10px;top:49%;font:600 14px/1.2 var(--text);color:var(--ink)}
.x7g .pl,.x7g .ow{position:absolute;left:10px;transform:translateY(-50%);white-space:nowrap}
.x7g .pl strong{display:block;font:800 26px/1 var(--head);color:var(--accent);letter-spacing:-.3px}
.x7g .pl span{display:block;font:600 14px/1.2 var(--text);color:var(--accent)}
.x7g .ow b{display:block;font:700 18px/1 var(--head);color:var(--slate)}
.x7g .ow span{display:block;font:400 14px/1.2 var(--text);color:var(--slate)}
.c9 .x7p{height:76px;margin-top:26px}
.x7dl{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--grey)}
.c9 .x7px span.dd{font-weight:600;color:var(--ink)}
.x7v{position:absolute;transform:translate(-50%,-50%);font:600 14px/1.2 var(--text);color:var(--wine);white-space:nowrap;text-align:center}
/* slide 7, refined (Pete, 24 Oct: cluttered): no chips, highlights or legends; labels on the lines, each block ending on
   its measured result; slide 3's endings as two marked dots; the one crimson number is what is left at 89 */
/* the two fixes lead, numbered: an 18 px ink heading a step under the panel's, the number in a wine disc */
.x7t h4{display:flex;align-items:center;gap:10px;font:700 18px/1.3 var(--text);color:var(--ink)}
.x7t h4 i{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--wine-g);color:#fff;font:700 14px/1 var(--text);font-style:normal}
.c9 .x7p{height:96px;margin:14px 0 0 44px}
.x7o{display:flex;align-items:baseline;gap:10px;margin:8px 0 0 36px}
.x7o span{font:600 18px/1 var(--text);color:var(--slate);white-space:nowrap}
.x7o strong{flex:none;font:700 34px/1 var(--head);color:var(--ink);letter-spacing:-1px}
.x7o2{margin:6px 0 0 36px;font:600 15px/1.35 var(--text);color:var(--ink)}
.x7o em{font:400 15px/1.35 var(--text);font-style:normal;color:var(--ink)}
/* fix 2's three rules as a row of icons with short labels (25 Oct, Pete: slide 7 still read as text) */
.x7ru{display:grid;grid-template-columns:1fr 1.1fr 1fr;column-gap:10px;margin:8px 0 0 36px}
.x7ru li{display:flex;align-items:center;gap:8px;font:500 14px/1.25 var(--text);color:var(--ink)}
.x7ru .ci{flex:none;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--wine-g)}
.x7ru .ic{width:15px;height:15px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* each fix's price sits in its own block (Pete, 24 Oct: the trade-off is needed, the repeated strip isn't) */
.x7pr{margin:6px 0 0 36px;font:400 14px/1.4 var(--text);color:var(--ink)}
.x7pr b{font-weight:600;color:var(--wine)}
/* the review's label inside the chart, beside its line, so the line doesn't rise into the heading */
.c9 .x7p .sw{top:0}
.c9 .x7p .sw span{right:auto;left:8px;top:2px;font-weight:600}
.c9 .x7p .pk span{color:var(--ink)}
.x7s .x3k.x7c3::after{background:var(--wine)}   /* the band's marker in wine: the one crimson number is what is left at 89 */
.x7w{gap:0}
.c9 .x7w>h3{margin-bottom:16px}   /* room between the panel rule and fix 1 (24 Oct: the disc touched the rule; .c9 .pn>h3 had set 0) */
.x7t+.x7t{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
.x7t .sub{font:400 14px/1.35 var(--text);color:var(--slate);margin:4px 0 0 36px}
.x7t .sub b{font-weight:700;color:var(--ink)}

/* slide 12 (25 Oct, Fahtai): the left, what is left at Carmen's 89, compact; the right, larger, in two groups by when
   it applies: if they die early (wills, guardian, staged trusts) and a legacy with purpose (the scholarship, while they
   are alive). Classes q12w/q12r/q12g/q12h/q12c/q12p are this slide's only. */
/* slide 12, right (24 Oct, Pete: too text-heavy, bland): how it passes on, as a small family tree in the family's own
   portraits; each child's trust as three dated stages */
.q12r{display:flex;flex-direction:column}
.q12t{display:flex;flex-direction:column;align-items:center;margin-top:16px}
.q12t .pic{width:52px;height:52px;margin:0;border:2px solid #fff;background:var(--mist);box-shadow:var(--lift);flex:none}
.q12t .par{display:flex;flex-direction:column;align-items:center;text-align:center}
.q12t .pp{display:flex}
.q12t .pp .pic+.pic{margin-left:-12px}
.q12t .par p{margin-top:6px;font:400 14px/1.35 var(--text);color:var(--ink)}
.q12t .par p b{display:block;font:700 16px/1.3 var(--text)}
.q12t .tree{position:relative;width:50%;height:30px;margin-top:8px}
.q12t .tree::before{content:"";position:absolute;left:50%;top:0;height:14px;border-left:2px solid #D3A6AD}
.q12t .tree::after{content:"";position:absolute;left:0;right:0;top:14px;height:16px;border:2px solid #D3A6AD;border-bottom:0;border-radius:10px 10px 0 0}
.q12t .kids{display:grid;grid-template-columns:1fr 1fr;width:100%}
.q12t .kid{display:flex;flex-direction:column;align-items:center;text-align:center}
.q12t .kid>div{margin-top:6px}
.q12t .kid b{display:block;font:700 16px/1.3 var(--text);color:var(--ink)}
.q12t .kid p{font:400 14px/1.35 var(--text);color:var(--ink)}
.q12t .st{position:relative;display:inline-flex;gap:24px;margin-top:8px}
.q12t .st::before{content:"";position:absolute;left:8px;right:8px;top:7px;border-top:2px solid var(--rose)}
.q12t .st span{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 15px/1 var(--text);color:var(--ink)}
.q12t .st span::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--wine-g)}
.q12t .st i{font:400 14px/1 var(--text);font-style:normal;color:var(--slate)}
.q12sc{display:flex;gap:12px;align-items:center;margin-top:auto;padding:12px 16px;background:var(--mist);font:400 15px/1.4 var(--text);color:var(--ink)}
.q12sc b{font-weight:700}
.q12sc .ci{flex:none;width:36px;height:36px;border-radius:50%;background:var(--wine-g);display:flex;align-items:center;justify-content:center}
.q12sc .ci .ic{width:19px;height:19px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* slide 12, left (24 Oct, Pete: beside HK$24.4M today, HK$7.7M looked like a loss): the wealth's first job is their own
   forty years, so today's figure stands alone, then what it pays for, then what is left, own way against plan */
.q12f{flex:1;display:flex;flex-direction:column;margin-top:14px}
.q12f .s1{display:flex;align-items:baseline;gap:14px}
.q12f .s1 .n{flex:none;font:700 34px/1 var(--head);color:var(--ink);letter-spacing:-1px}
.q12f .s1 p,.q12f .s2 p{font:400 14px/1.4 var(--text);color:var(--ink)}
.q12f .s1 p b{display:block;font:600 16px/1.3 var(--text)}
.q12f .s2{display:flex;gap:14px;align-items:stretch;margin:10px 0 0 14px}
.q12f .s2 i{flex:none;width:0;border-left:2px solid var(--rose);position:relative;margin:2px 0 6px}
.q12f .s2 i::after{content:"";position:absolute;left:-7px;bottom:-6px;border:6px solid transparent;border-top:8px solid var(--rose);border-bottom:0}
.q12f .s2 p{padding:4px 0 10px}
.q12f .s2 p b{font-weight:600}
.q12f .s3{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
.q12f .s3 .k{font:600 15px/1.35 var(--text);color:var(--ink)}
.q12f .s3 .x{margin-top:10px;font:600 15px/1.35 var(--text);color:var(--accent)}
