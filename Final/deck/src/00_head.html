<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM</title>
<!--
  The Final deck (Team Axis), storyline v4: Final/Final_Plan.md §4.5 says what each slide must prove; §4.2 the
  framework; §4.3 the story. One file of 1280 x 720 slides. Build: .venv/Scripts/python.exe Final/deck/make.py, then
  Final/deck/make_pptx.py (AGENTS.md "Building the deck").
  Started 10 Nov from the slide-design starter. Each slide's script is its <aside class="notes">: the spoken words, each
  turn opened by PETE:, FAHTAI:, WIN: or LOOKBUA:, then "[Notes: ...]" for background. Build steps: data-b="2", "3"...
  on an element (one click each, in the script's order); a slide with class "reveal" shows them from nothing instead of
  grey. Backup slides carry data-backup and are not timed.
  Fonts: Plus Jakarta Sans, SIL Open Font License (fonts/OFL.txt). Icons: Lucide (ISC License).
-->
<style>
@font-face{font-family:"PJS";src:url("fonts/PlusJakartaSans-Regular.ttf");font-weight:400}
@font-face{font-family:"PJS";src:url("fonts/PlusJakartaSans-Medium.ttf");font-weight:500}
@font-face{font-family:"PJS";src:url("fonts/PlusJakartaSans-SemiBold.ttf");font-weight:600}
@font-face{font-family:"PJS";src:url("fonts/PlusJakartaSans-Bold.ttf");font-weight:700}
@font-face{font-family:"PJS";src:url("fonts/PlusJakartaSans-ExtraBold.ttf");font-weight:800}
:root{
  /* Look A (Pete, 11 Nov; Final_Plan.md §3 "Look"): Plus Jakarta Sans, the crimson accent, the crimson bar beside
     each title, and the ledger's two new columns. A′'s thick rule under the title was tried and dropped the same day.
     Chosen from options rendered side by side (Final/looks/looks.html). Still to do: the 20-second projector test.
     Change values here; every slide follows. */
  --paper:#FFFFFF; --mist:#FBF3F4; --block:#F4E6E9; --rule:#E2CFD3; --grey:#8A747A;   /* tints wash out on a projector:
                                                                    use them for fills behind ink, never for text */
  --ink:#1B1716; --slate:#5E4A50;                                    /* slate 8.2:1 on white: the lightest text colour */
  --accent:#C80E1E; --accent-deep:#8E0A16; --accent-tint:#F4E6E9;   /* money at risk; the point a slide makes (5.9:1) */
  --out:#0E7490;                                                     /* what the money does to the world: Impact teal */
  /* section colours, one per PRISM letter (slide 2's rays; deeper shades here so text on white passes contrast) */
  --P:#B45309; --R:#C80E1E; --I:#0E7490; --S:#6D28D9; --M:#475569;
  --leaf:#3F9A55; --leaf-tint:#E3F1E6;                               /* the green label, one job only; passes both
                                                                    red-green checks against the crimson; always
                                                                    carries its word, never colour alone */
  --text:"PJS","Plus Jakarta Sans",Arial,sans-serif;
  --head:"PJS","Plus Jakarta Sans",Arial,sans-serif;
  --num:"PJS","Plus Jakarta Sans",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#E2E2DF;color:var(--ink);font:400 16px/1.42 var(--text);font-variant-numeric:lining-nums}
p,h1,h2,h3,h4,ul,ol,figure,table,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
b,strong{font-weight:600}
.deck{zoom:var(--z,1);display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0}
.slide{position:relative;width:1280px;height:720px;flex:none;background:var(--paper);overflow:hidden;
  padding:34px 48px 64px;display:flex;flex-direction:column;box-shadow:0 2px 14px rgba(29,29,27,.18)}
@page{size:1280px 720px;margin:0}
@media print{
  body{background:#fff}
  .deck{zoom:1;gap:0;padding:0;display:block}
  .slide{box-shadow:none;break-after:page;page-break-after:always}
}

/* icons */
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:28px;height:28px}
.ic.sm{width:16px;height:16px}

/* header: the kicker names the step and its rule; the title is the idea (any client); the crimson bar marks the point */
.head{border-left:6px solid var(--accent);padding:1px 0 2px 16px}
.kick{font:700 15px/1.3 var(--head);color:var(--accent);letter-spacing:.2px}
.head h2{font:700 34px/1.12 var(--head);letter-spacing:-.4px;margin-top:5px;max-width:1120px;text-wrap:balance}

/* the green label: a sticker with its word on it (the one job green has) */
.chip{display:inline-block;white-space:nowrap;background:var(--leaf);color:#fff;font:800 16px/1 var(--text);padding:9px 14px;border-radius:20px}

/* body */
.body{flex:1;min-height:0;margin-top:18px;display:flex;gap:30px}
.body.stack{flex-direction:column;gap:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.sub{font:700 19px/1.22 var(--head);padding-bottom:6px;border-bottom:1.5px solid var(--ink);margin-bottom:12px}
.muted{color:var(--slate)}
.push{margin-top:auto}
.tag{display:inline-block;font:600 10px/1 var(--text);letter-spacing:.05em;padding:2.5px 5px 2px;border:1px solid var(--grey);
  color:var(--slate);border-radius:2px;vertical-align:1px;white-space:nowrap}

/* a slide still to build: what it must prove lives in the plan, not here (one home per fact) */
.todo{flex:1;border:2px dashed var(--grey);border-radius:8px;padding:22px 26px;display:flex;flex-direction:column;gap:10px;
  color:var(--slate);font:500 17px/1.45 var(--text)}
.todo b{color:var(--ink)}

/* the one-sentence conclusion */
.sowhat{margin-top:14px;background:var(--ink);color:#fff;font:600 20px/1.28 var(--head);padding:12px 22px;border-radius:3px}

/* footer: the framework tracker (Profile · Risk · Impact · Select · Monitor), the brief's areas, the source, the page */
.foot{position:absolute;left:48px;right:48px;bottom:15px;height:26px;display:flex;align-items:center;gap:18px;font-size:12px;color:var(--slate)}
.line{display:flex;align-items:center}
.line .st{position:relative;padding-left:15px;margin-right:30px;white-space:nowrap}
.line .st::before{content:"";position:absolute;left:0;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;border:2px solid var(--grey);background:#fff}
.line .st::after{content:"";position:absolute;left:calc(100% + 5px);top:50%;width:20px;height:2px;margin-top:-1px;background:var(--rule)}
.line .st:last-child{margin-right:0}
.line .st:last-child::after{display:none}
.line .st.on{color:var(--ink);font-weight:700}
.line .st.on::before{background:var(--accent);border-color:var(--accent)}
.areas{white-space:nowrap;color:var(--grey)}
.src{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{font-weight:700;color:var(--ink);min-width:16px;text-align:right}

/* the prism badge (look A, Pete 11 Nov): the deck's recurring element, as the house was in Round Two. It sits in the
   footer of every content slide; the current section's rays are lit. Slides 1, 2 and 11 (the dark stage) don't carry it. */
.foot{height:44px;bottom:9px}
.badge-prism{display:flex;align-items:center;gap:14px;flex:none}
.badge-prism svg text{font-family:var(--text)}
.badge-prism p{font:700 14px/1.2 var(--text);letter-spacing:.4px;color:var(--slate)}
.badge-prism p span{display:block;font:500 12px/1.3 var(--text);letter-spacing:0;color:var(--grey);margin-top:1px}
.kick b.k-impact{color:var(--I)}
/* the twist kicker (Pete, 11 Nov): a step slide names its PRISM letter and the twist slide 2 gives it, so the framework
   is the spine of every slide, not only of slide 2. kt- classes only here. */
.kt{display:flex;align-items:center;gap:9px;white-space:nowrap}
.kt-L{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:3px;
  color:#fff;background:var(--accent);font:800 14px/1 var(--head)}
.sec-P .kt-L{background:var(--P)} .sec-R .kt-L{background:var(--R)} .sec-S .kt-L{background:var(--S)}
.sec-M .kt-L{background:var(--M)} .kt-L.kt-I{background:var(--I);margin-left:-5px}
.kt-n{font-weight:800;margin-right:4px} .kt-n .kt-i{color:var(--I)}
.kt-do{font:700 15px/1.3 var(--text);color:var(--ink)}
.kt-not{font:500 15px/1.3 var(--text);color:var(--grey)}
/* each section's kicker and side bar take its letter's colour, matching the lit ray in the badge */
.sec-P .head{border-left-color:var(--P)} .sec-P .kick{color:var(--P)}
.sec-R .head{border-left-color:var(--R)} .sec-R .kick{color:var(--R)}
.sec-S .head{border-left-color:var(--S)} .sec-S .kick{color:var(--S)}
.sec-M .head{border-left-color:var(--M)} .sec-M .kick{color:var(--M)}

/* big numbers */
.hero{font:800 96px/0.92 var(--num);letter-spacing:-1px}
.num{font:800 38px/1 var(--num)}

/* tables */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1.5px solid var(--rule);vertical-align:top}
th{font:700 14px/1.3 var(--head);color:var(--slate);border-bottom:1.5px solid var(--ink)}
tr.total td{border-top:2.5px solid var(--ink);font-weight:700}

/* type scale (projector): titles 34, column heads 19-21, body 16-19, smallest 13 (footer only), big numbers 30-150 */

/* ---- forms for the Final go below, one commented block per form; class names are global, so grep first ---- */

/* ---- slide 4: the plan's timeline, causes above, costs below (s4- classes; Pete, 11 Nov, version C) ---- */
.s4-body{position:relative}
.s4-body svg{position:absolute;left:0;top:0}
.s4-lbl{position:absolute;left:0;top:227px;display:flex;flex-direction:column-reverse;gap:6px}
.s4-lbl p{font:600 13px/1.3 var(--text);color:var(--leaf)}
.s4-lbl .chip{font-size:14px;padding:7px 11px}

/* ---- slide 3: Profile, the family and their limits, and the answer (s3- classes; Pete, 11 Nov) ---- */
.s3-body{display:flex;gap:28px;align-items:stretch}
.s3-left{flex:1;display:flex;flex-direction:column}
.s3-cap{font:800 13px/1 var(--text);letter-spacing:1px;text-transform:uppercase;color:var(--P);margin-bottom:10px}
.s3-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.s3-p{border-top:5px solid var(--P);background:#FBF4EC;border-radius:0 0 6px 6px;padding:10px 12px}
.s3-n{font:800 18px/1.2 var(--head)}
.s3-r{font:500 13.5px/1.3 var(--text);color:var(--slate)}
.s3-w{font:500 14.5px/1.3 var(--text);font-style:italic;margin-top:6px}
.s3-l{font:700 14.5px/1.3 var(--text);color:var(--P);margin-top:6px}
.s3-own{font:500 15.5px/1.4 var(--text);margin:12px 0 14px}
.s3-own i{color:var(--slate)}
.s3-lims{display:flex;gap:12px}
.s3-lims div{flex:1;border-left:3px solid var(--P);padding:2px 0 2px 12px}
.s3-lims b{display:block;font:800 24px/1.1 var(--num);color:var(--P)}
.s3-lims span{display:block;font:500 14px/1.3 var(--text);margin-top:4px}
.s3-ans{width:410px;flex:none;background:var(--ink);color:#fff;border-radius:8px;padding:20px 22px;display:flex;flex-direction:column}
.s3-acap{font:800 13px/1 var(--text);letter-spacing:1px;text-transform:uppercase;color:#F4B740}
.s3-big{font:800 40px/1.1 var(--head);margin-top:10px}
.s3-cap2{font:500 15px/1.4 var(--text);color:#D8CFD1;margin-top:6px;padding-bottom:14px;border-bottom:1px solid #3A2F31}
.s3-cap2 b{color:#fff}
.s3-out{margin-top:14px}
.s3-out b{display:block;font:800 34px/1.1 var(--num);color:#fff}
.s3-out span{display:block;font:500 15px/1.3 var(--text);color:#D8CFD1}
.s3-split{margin-top:auto;font:500 13.5px/1.4 var(--text);color:#B9ACAF;font-style:italic;padding-top:12px}

/* ---- slide 3: our answer on one measure (a3- classes; rebuilt 13 Nov after Pete's verdict on the dot chart).
   One SVG of bars from zero, drawn 1:1 in px; the bars' x and widths come from numbers.json through series.py
   (the b3_ tokens). ---- */
.a3-body{flex-direction:column;gap:0;margin-top:22px}
.a3-body svg{display:block;overflow:visible}
.a3-body svg text{font-family:var(--text)}
.a3-cap{font:500 16px/1.3 var(--text);color:var(--slate);margin-top:auto;padding-top:8px;border-top:1px solid var(--rule)}
.a3-cap b{color:var(--ink)}

/* ---- slide 4: Profile, the limits first (pro- classes; Pete, 11 Nov) ---- */
.pro-body{display:flex;flex-direction:column;justify-content:center;gap:22px}
.pro-row{display:flex;align-items:center;gap:16px}
.pro-who{flex:1;border-top:5px solid var(--P);padding-top:12px}
.pro-n{font:800 22px/1.2 var(--head)}
.pro-q{font:500 17px/1.35 var(--text);font-style:italic;margin-top:6px}
.pro-l{font:700 16px/1.35 var(--text);color:var(--P);margin-top:8px}
.pro-arr{font:800 40px/1 var(--head);color:var(--P)}
.pro-mid{width:380px;flex:none;background:var(--P);color:#fff;border-radius:10px;padding:22px 24px;text-align:center}
.pro-cap{font:800 14px/1 var(--text);letter-spacing:1px;text-transform:uppercase;opacity:.9}
.pro-big{font:800 64px/1.05 var(--num);margin:8px 0 6px}
.pro-s{font:500 15.5px/1.4 var(--text)}
.pro-limit{font:500 21px/1.35 var(--text);border-left:6px solid var(--P);padding:6px 0 6px 16px}
.pro-limit b{font-weight:800}
.pro-also{font:500 15px/1.4 var(--text);color:var(--slate)}

/* ---- slide 2: the PRISM introduction page (dark stage; s2- classes are used on this slide only) ---- */
.slide.s2-stage{padding:0;display:block;background:#120E0F;color:#fff}
.s2-art{position:absolute;left:0;top:0;width:1280px;height:720px}
.s2-kick{position:absolute;left:48px;top:40px;font:700 15px/1 var(--head);color:#FF6B75;letter-spacing:.4px}
.s2-stage h2.s2-word{position:absolute;left:44px;top:60px;margin:0;font:800 92px/1 var(--head);letter-spacing:10px;color:#fff}
.s2-sub{position:absolute;left:48px;top:162px;width:360px;font:600 24px/1.25 var(--head);color:#fff}
.s2-sub2{position:absolute;left:48px;top:226px;width:300px;font:500 16px/1.4 var(--text);color:#B9ACAF}
.s2-chip{position:absolute;left:48px;top:409px;background:var(--leaf);color:#fff;font:800 18px/1 var(--text);padding:12px 16px;
  border-radius:22px;white-space:nowrap;box-shadow:0 0 22px rgba(63,154,85,.45)}
.s2-under{position:absolute;left:48px;top:464px;font:600 15px/1.3 var(--text);color:#B9ACAF}
.s2-L{position:absolute;left:738px;width:44px;margin:0;font:800 46px/1 var(--num);text-align:center;text-shadow:0 0 18px currentColor}
.s2-row{position:absolute;left:796px;right:34px}
.s2-name{font:700 19px/1.25 var(--head);color:#fff;white-space:nowrap}
.s2-name span{font-weight:500;color:#C4B8BB}
.s2-do{font:600 16px/1.35 var(--text);color:#fff;margin-top:4px;white-space:nowrap}
.s2-not{font:500 15px/1.35 var(--text);color:#A99EA1;margin-top:2px;white-space:nowrap}
.s2-std{position:absolute;left:48px;bottom:22px;width:440px;font:500 13.5px/1.4 var(--text);color:#9C9093}
.s2-pg{position:absolute;right:40px;bottom:22px;font:700 13px var(--text);color:#9C9093}

/* ---- slide 1: the open (dark stage like slide 2; s1- classes are used on this slide only; Pete, 11 Nov) ---- */
.slide.s1-stage{padding:0;display:block;background:#120E0F;color:#fff}
.s1-kick{position:absolute;left:48px;top:44px;font:800 13px/1 var(--text);letter-spacing:1px;text-transform:uppercase;color:#FF6B75}
.s1-q{position:absolute;left:48px;top:68px;width:430px;font:800 38px/1.12 var(--head);color:#fff}
.s1-chip{position:absolute;left:48px;top:192px;background:var(--leaf);color:#fff;font:800 18px/1 var(--text);padding:11px 16px;
  border-radius:22px;white-space:nowrap;box-shadow:0 0 22px rgba(63,154,85,.45)}
.s1-funds{position:absolute;left:48px;top:206px;width:430px}
.s1-cap{font:800 13px/1 var(--text);letter-spacing:1px;text-transform:uppercase;color:#B9ACAF;margin-bottom:12px}
.s1-card{display:flex;align-items:center;gap:14px;background:#1E1719;border:1px solid #3A2F31;border-radius:10px;
  padding:14px 16px;margin-bottom:10px}
.s1-card p{font:700 18px/1.3 var(--text);color:#fff}
.s1-mini{flex:none;background:var(--leaf);color:#fff;font:800 14px/1 var(--text);padding:8px 11px;border-radius:16px;white-space:nowrap}
.s1-who{flex:none;background:#3A2F31;color:#fff;font:800 14px/1 var(--text);letter-spacing:.6px;padding:8px 11px;border-radius:16px}
.s1-ask{position:absolute;left:48px;top:420px;width:430px}
.s1-ask .s1-chip{position:static;display:inline-block}
.s1-plan{font:600 16px/1.4 var(--text);color:#D8CFD1;margin-top:14px}
.s1-src{font:500 12.5px/1.4 var(--text);color:#8C8083;margin-top:8px}
.s1-chart{position:absolute;left:520px;top:36px;width:712px}
.s1-svg{display:block;font-family:var(--text)}
.s1-chart .s1-src{margin-top:-6px;padding-left:56px}
.s1-end{position:absolute;left:48px;right:48px;top:596px;border-top:1px solid #3A2F31;padding-top:16px}
.s1-stage h2.s1-line{margin:0;font:800 30px/1.15 var(--head);color:#fff;letter-spacing:-.2px}
.s1-result{font:500 17px/1.35 var(--text);color:#B9ACAF;margin-top:8px}
.s1-pg{position:absolute;right:40px;bottom:22px;font:700 13px var(--text);color:#9C9093}

/* builds (from Round Two): data-b="n" is the step an element is spoken in. make.py --builds repeats a slide once per
   step with class upto-k; later steps stay in grey, or are hidden on a slide with class "reveal" (space kept, so the
   layout never moves). The HTML preview only: make_pptx.py writes PowerPoint's own click animations. */
.upto-1 [data-b="2"],.upto-1 [data-b="3"],.upto-1 [data-b="4"],.upto-1 [data-b="5"],.upto-1 [data-b="6"],.upto-1 [data-b="7"],.upto-1 [data-b="8"],.upto-1 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-2 [data-b="3"],.upto-2 [data-b="4"],.upto-2 [data-b="5"],.upto-2 [data-b="6"],.upto-2 [data-b="7"],.upto-2 [data-b="8"],.upto-2 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-3 [data-b="4"],.upto-3 [data-b="5"],.upto-3 [data-b="6"],.upto-3 [data-b="7"],.upto-3 [data-b="8"],.upto-3 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-4 [data-b="5"],.upto-4 [data-b="6"],.upto-4 [data-b="7"],.upto-4 [data-b="8"],.upto-4 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-5 [data-b="6"],.upto-5 [data-b="7"],.upto-5 [data-b="8"],.upto-5 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-6 [data-b="7"],.upto-6 [data-b="8"],.upto-6 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-7 [data-b="8"],.upto-7 [data-b="9"]{filter:grayscale(1);opacity:.3}
.upto-8 [data-b="9"]{filter:grayscale(1);opacity:.3}
.reveal.upto-1 [data-b="2"],.reveal.upto-1 [data-b="3"],.reveal.upto-1 [data-b="4"],.reveal.upto-1 [data-b="5"],.reveal.upto-1 [data-b="6"],.reveal.upto-1 [data-b="7"],.reveal.upto-1 [data-b="8"],.reveal.upto-1 [data-b="9"]{visibility:hidden}
.reveal.upto-2 [data-b="3"],.reveal.upto-2 [data-b="4"],.reveal.upto-2 [data-b="5"],.reveal.upto-2 [data-b="6"],.reveal.upto-2 [data-b="7"],.reveal.upto-2 [data-b="8"],.reveal.upto-2 [data-b="9"]{visibility:hidden}
.reveal.upto-3 [data-b="4"],.reveal.upto-3 [data-b="5"],.reveal.upto-3 [data-b="6"],.reveal.upto-3 [data-b="7"],.reveal.upto-3 [data-b="8"],.reveal.upto-3 [data-b="9"]{visibility:hidden}
.reveal.upto-4 [data-b="5"],.reveal.upto-4 [data-b="6"],.reveal.upto-4 [data-b="7"],.reveal.upto-4 [data-b="8"],.reveal.upto-4 [data-b="9"]{visibility:hidden}
.reveal.upto-5 [data-b="6"],.reveal.upto-5 [data-b="7"],.reveal.upto-5 [data-b="8"],.reveal.upto-5 [data-b="9"]{visibility:hidden}
.reveal.upto-6 [data-b="7"],.reveal.upto-6 [data-b="8"],.reveal.upto-6 [data-b="9"]{visibility:hidden}
.reveal.upto-7 [data-b="8"],.reveal.upto-7 [data-b="9"]{visibility:hidden}
.reveal.upto-8 [data-b="9"]{visibility:hidden}

/* speaker notes: written in the slide, never shown or printed; make.py turns them into the script */
.notes{display:none}
</style>
</head>
<body>
<!--ICON_SPRITE-->
<main class="deck">
