<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built to Last: look options</title>
<!--
  Look checkpoint for the v8 deck (plan §6): the same two slides (cover, Call 2) in two looks, so Pete compares the
  look, not the layout. Both follow the plan's system (§4): six type sizes (title 32, panel heading 18, body 16,
  label 14, tag 12, numbers 40 / 72; the cover title is the one exception), a 12-column grid, three panels whose
  headings read as one sentence, one conclusion bar, one navigation device.
  A · Drawing set: navy ink, one brass accent, IBM Plex Sans + Plex Sans Condensed; the language of an architect's
      drawing (grid bubbles number the calls, a dimension line measures the difference, a title block is the footer).
  B · Swiss: near-black ink, one cobalt accent, Archivo + Archivo Narrow; no motif.
  Fonts: SIL Open Font License (fonts/OFL-*.txt).
-->
<style>
@font-face{font-family:"Plex";src:url("fonts/IBMPlexSans-400.ttf");font-weight:400}
@font-face{font-family:"Plex";src:url("fonts/IBMPlexSans-500.ttf");font-weight:500}
@font-face{font-family:"Plex";src:url("fonts/IBMPlexSans-600.ttf");font-weight:600}
@font-face{font-family:"Plex";src:url("fonts/IBMPlexSans-700.ttf");font-weight:700}
@font-face{font-family:"PlexC";src:url("fonts/IBMPlexSansCondensed-500.ttf");font-weight:500}
@font-face{font-family:"PlexC";src:url("fonts/IBMPlexSansCondensed-600.ttf");font-weight:600}
@font-face{font-family:"PlexC";src:url("fonts/IBMPlexSansCondensed-700.ttf");font-weight:700}
@font-face{font-family:"Arch";src:url("fonts/Archivo-400.ttf");font-weight:400}
@font-face{font-family:"Arch";src:url("fonts/Archivo-500.ttf");font-weight:500}
@font-face{font-family:"Arch";src:url("fonts/Archivo-600.ttf");font-weight:600}
@font-face{font-family:"Arch";src:url("fonts/Archivo-700.ttf");font-weight:700}
@font-face{font-family:"ArchN";src:url("fonts/ArchivoNarrow-500.ttf");font-weight:500}
@font-face{font-family:"ArchN";src:url("fonts/ArchivoNarrow-600.ttf");font-weight:600}
@font-face{font-family:"ArchN";src:url("fonts/ArchivoNarrow-700.ttf");font-weight:700}

/* ---- the two looks, as tokens ---- */
.la{--paper:#FFFFFF;--mist:#F1F4F7;--rule:#D3DAE2;--grey:#A3AEBA;--slate:#4F5E6E;--ink:#14233B;
    --accent:#B07D24;--accent-deep:#86601B;--text:"Plex",Arial,sans-serif;--head:"PlexC","Arial Narrow",sans-serif}
.lb{--paper:#FFFFFF;--mist:#F2F2F2;--rule:#D9D9D9;--grey:#A0A0A0;--slate:#545454;--ink:#121212;
    --accent:#1D4ED8;--accent-deep:#173EA9;--text:"Arch",Arial,sans-serif;--head:"ArchN","Arial Narrow",sans-serif}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#DADDE0}
p,h1,h2,h3,h4,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.deck{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0}
.slide{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:var(--paper);color:var(--ink);
  font:400 16px/1.42 var(--text);padding:34px 48px 0;display:flex;flex-direction:column}
@page{size:1280px 720px;margin:0}
@media print{body{background:#fff}.deck{gap:0;padding:0;display:block}.slide{break-after:page}}
p,li,span,b{text-wrap:pretty}
.tag{font:400 12px/1 var(--text);color:var(--slate);white-space:nowrap}
.tag::before{content:"("}.tag::after{content:")"}

/* ---- header: kicker, title ---- */
.hd{display:flex;flex-direction:column;gap:6px}
.kick{display:flex;align-items:center;gap:10px;font:600 18px/1.2 var(--head);color:var(--slate)}
.kick small{font:400 14px/1 var(--text);color:var(--slate)}
.hd h2{font:600 32px/1.12 var(--head);letter-spacing:-.2px;max-width:1100px;text-wrap:balance}

/* ---- three panels on a 12-column grid; headings on a rule read as one sentence ---- */
.panels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;margin-top:22px}
.pn{display:flex;flex-direction:column;min-width:0}
.pn>h3{font:600 18px/1.25 var(--head);padding-bottom:8px;border-bottom:1.5px solid var(--ink);margin-bottom:14px}
.cap{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:auto;padding-top:8px}

/* ---- conclusion bar ---- */
.bar{flex:none;margin-top:16px;background:var(--ink);color:#fff;font:600 18px/1.3 var(--head);padding:12px 24px;text-align:center;text-wrap:balance}

/* ---- footer ---- */
.ft{flex:none;height:52px;display:flex;align-items:center;gap:20px;font:400 12px/1.3 var(--text);color:var(--slate)}
.ft .src{flex:1}

/* ---- panel 1: ten typical futures (the model's fut* keys; x = (year - 2026) / 40) ---- */
.fz{position:relative;display:flex;flex-direction:column;gap:7px;margin:22px 26px 0 0}
.fz .goal{position:absolute;top:-22px;bottom:-4px;left:100%;border-left:1.5px dashed var(--ink)}
.fz .goal i{position:absolute;top:0;right:7px;font:600 14px/1 var(--head);font-style:normal;white-space:nowrap}
.fz .ln{position:relative;height:15px}
.fz .ln>i{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:var(--w);background:var(--grey)}
.fz .ln>b{position:absolute;top:50%;left:var(--w);width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--ink)}
.fz .ln.lasts>i{width:calc(100% + 14px)}
.fz .ln.lasts>b{left:calc(100% + 14px);background:var(--paper);border:2px solid var(--ink)}
.fax{position:relative;height:38px;margin-right:26px;border-top:1.5px solid var(--ink);margin-top:10px}
.fax span{position:absolute;top:6px;font:400 14px/1.25 var(--text);color:var(--slate);white-space:nowrap}
.fax span b{font-weight:600;color:var(--ink)}
.fkey{display:flex;gap:16px;font:400 14px/1.3 var(--text);color:var(--slate);margin-top:6px}
.fkey i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:-1px}
.fkey i.o{background:var(--paper);border:2px solid var(--ink)}

/* ---- panel 2: four decisions as cumulative bars (grey = where the step started, ink = what it adds) ---- */
.cb{display:flex;flex-direction:column;gap:12px}
.cb .r{display:grid;grid-template-columns:172px 1fr;column-gap:12px;align-items:center}
.cb .r p{font:400 14px/1.25 var(--text)}
.cb .r p b{font-weight:600}
.cb .tr{position:relative;height:24px}
.cb .tr i{position:absolute;top:0;bottom:0;left:0}
.cb .tr i.was{background:var(--rule)}
.cb .tr i.add{background:var(--ink)}
.cb .tr span{position:absolute;top:50%;transform:translateY(-50%);padding-left:8px;font:600 16px/1 var(--head);white-space:nowrap}
.cb .r.base .tr i.add{background:var(--grey)}
.cb .r.top .tr i.add{background:var(--accent)}
.cb .r.top .tr span{font:600 40px/1 var(--head);color:var(--accent)}
.scale{position:relative;height:44px;margin-left:184px;margin-top:6px}

/* ---- panel 3: the defend panel ---- */
.df{display:flex;flex-direction:column;gap:14px}
.df h4{font:600 16px/1.25 var(--head)}
.df p{font:400 14px/1.38 var(--text);color:var(--slate);margin-top:3px}
.df p b{color:var(--ink);font-weight:600}

/* ==================== A · Drawing set ==================== */
/* grid bubble: a drawing's column marker, numbering the five calls */
.la .gb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);font:600 18px/1 var(--head);color:var(--ink);flex:none}
.la .kick{color:var(--ink)}
/* dimension line: measures one difference; 45-degree ticks at both ends, the label over the line */
.la .dimn{position:absolute;top:14px;height:0;border-top:1.5px solid var(--accent-deep)}
.la .dimn::before,.la .dimn::after{content:"";position:absolute;top:-7px;height:14px;border-left:1.5px solid var(--accent-deep);transform:rotate(45deg)}
.la .dimn::before{left:0}.la .dimn::after{right:0}
.la .dimn span{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:600 14px/1 var(--head);color:var(--accent-deep);white-space:nowrap;background:var(--paper);padding:0 6px}
.la .dimx{position:absolute;top:-8px;bottom:0;border-left:1px dashed var(--grey)}
.la .scale{margin-top:16px}
/* title block: the drawing's footer (project, sheet title, sheet number) */
.la .tb{display:flex;border:1.5px solid var(--ink);height:34px;font:500 14px/1 var(--head);color:var(--ink)}
.la .tb span{display:flex;align-items:center;padding:0 12px;border-left:1px solid var(--ink);white-space:nowrap}
.la .tb span:first-child{border-left:0;font-weight:600}
.la .bar{background:var(--ink)}
/* cover A */
.la.cv{padding:0;flex-direction:row}
.la.cv .l{flex:1;padding:46px 56px 0;display:flex;flex-direction:column}
.la.cv .ev{font:400 14px/1.4 var(--text);color:var(--slate)}
.la.cv h1{font:600 128px/.95 var(--head);letter-spacing:-2px;margin-top:96px}
.la.cv .span{position:relative;height:30px;margin-top:22px;width:560px}
.la.cv .sub{font:400 24px/1.35 var(--text);margin-top:20px;max-width:560px}
.la.cv .who{display:flex;gap:28px;margin-top:auto;padding-bottom:28px;font:400 14px/1.35 var(--text);color:var(--slate)}
.la.cv .who b{display:block;font:600 16px/1.3 var(--head);color:var(--ink)}
.la.cv .r{width:500px;flex:none;background:var(--mist);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;position:relative}
.la.cv .fam{display:grid;grid-template-columns:repeat(2,160px);gap:22px 40px}
.la.cv .fam p{text-align:center;font:600 16px/1.3 var(--head)}
.la.cv .fam p span{display:block;font:400 14px/1.3 var(--text);color:var(--slate)}
.pic{display:block;width:160px;height:160px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink);background:#fff;margin-bottom:10px}
.pic img{width:100%;height:100%;object-fit:cover}
.la.cv .note{font:400 12px/1.3 var(--text);color:var(--slate);margin-top:22px;text-align:center}
.la.cv .tb{position:absolute;right:24px;bottom:22px}

/* ==================== B · Swiss ==================== */
.lb .gb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--accent);color:#fff;font:700 18px/1 var(--head);flex:none}
.lb .kick{color:var(--accent-deep)}
.lb .dimn{position:absolute;top:8px;height:12px;border:2px solid var(--ink);border-top:0}
.lb .dimn span{position:absolute;left:50%;top:18px;transform:translateX(-50%);font:600 14px/1 var(--head);white-space:nowrap}
.lb .dimx{display:none}
.lb .trk{position:absolute;top:36px;right:48px;display:flex;gap:6px;font:600 14px/1 var(--head);color:var(--grey)}
.lb .trk span{padding:5px 8px;border:1.5px solid var(--rule)}
.lb .trk span.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* cover B */
.lb.cv{padding:0}
.lb.cv .top{height:14px;background:var(--accent);width:240px;margin:56px 0 0 56px}
.lb.cv h1{font:700 150px/.9 var(--head);letter-spacing:-3px;margin:40px 0 0 52px}
.lb.cv .sub{font:400 24px/1.35 var(--text);margin:26px 0 0 56px;max-width:620px}
.lb.cv .ev{position:absolute;top:56px;right:56px;text-align:right;font:400 14px/1.4 var(--text);color:var(--slate)}
.lb.cv .bot{position:absolute;left:56px;right:56px;bottom:40px;display:flex;align-items:flex-end;gap:28px}
.lb.cv .who{display:flex;gap:28px;font:400 14px/1.35 var(--text);color:var(--slate);flex:1}
.lb.cv .who b{display:block;font:600 16px/1.3 var(--head);color:var(--ink)}
.lb.cv .fam{display:flex;gap:14px}
.lb.cv .fam .pic{width:104px;height:104px;border:0;background:var(--mist);margin:0}
.lb.cv .note{position:absolute;right:56px;bottom:14px;font:400 12px/1.3 var(--text);color:var(--slate)}

/* ==================== Call 2, rebuilt (20 Oct): every panel is one step of the argument ====================
   More shares barely help -> four decisions do -> each decision has a price. Panels 1 and 2 share one bar scale
   (the track is 150 px = 100% in both) and open with parallel headline numbers, so the comparison is instant; panel 2
   carries panel 1's best as a dashed reference line. Every panel ends on a grey evidence note at the same baseline. */
.c2 .pn{min-height:0}
.c2 .big{font:700 40px/1 var(--head);letter-spacing:-.5px}
.c2 .big.on{color:var(--accent)}
.c2 .bigl{font:400 14px/1.35 var(--text);color:var(--slate);margin:6px 0 16px}
.c2 .rows{position:relative;display:flex;flex-direction:column;gap:10px}
.c2 .row{display:grid;column-gap:8px;align-items:center}
.c2 .p1 .row{grid-template-columns:1fr 150px 46px 44px}
.c2 .p2 .row{grid-template-columns:1fr 150px 70px}
.c2 .row p{font:400 14px/1.25 var(--text)}
.c2 .row p b{font-weight:600}
.c2 .row.hd{font:600 12px/1.2 var(--text);color:var(--slate)}
.c2 .row.hd span{text-align:left}
.c2 .trk2{position:relative;height:24px;background:var(--mist)}
.c2 .trk2 i{position:absolute;top:0;bottom:0;left:0}
.c2 .trk2 i.g{background:var(--grey)}
.c2 .trk2 i.was{background:#CFCFCF}
.c2 .trk2 i.add{background:var(--ink)}
.c2 .trk2 i.acc{background:var(--accent)}
.c2 .val{font:600 16px/1 var(--head)}
.c2 .val.on{font:700 40px/1 var(--head);color:var(--accent)}
.c2 .wst{font:600 16px/1 var(--head);color:var(--ink)}
.c2 .p1 .rows{gap:22px}
.c2 .p1 .row.hd{margin-bottom:-12px}
/* panel 1's best, carried into panel 2's track */
.c2 .ref{position:absolute;top:-6px;bottom:-6px;border-left:2px dashed var(--ink);z-index:2}
.c2 .ref span{position:absolute;top:-20px;left:-4px;font:600 12px/1 var(--text);white-space:nowrap}
/* panel 3: the price of each decision, a ledger with one figure each */
.c2 .ldg li{display:grid;grid-template-columns:26px 1fr;column-gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.c2 .ldg li:first-child{padding-top:0}
.c2 .ldg .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--ink);color:#fff;font:700 12px/1 var(--head)}
.c2 .ldg b{display:block;font:600 16px/1.25 var(--head)}
.c2 .ldg p{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:2px}
.c2 .ldg p em{font-style:normal;font-weight:600;color:var(--ink)}
/* the evidence note that closes every panel, on one baseline */
.c2 .nt{margin-top:auto;background:var(--mist);border-left:3px solid var(--ink);padding:10px 12px;font:400 14px/1.38 var(--text)}
.c2 .nt b{font-weight:600}

@font-face{font-family:"Inter";src:url("fonts/Inter-400.ttf");font-weight:400}
@font-face{font-family:"Inter";src:url("fonts/Inter-500.ttf");font-weight:500}
@font-face{font-family:"Inter";src:url("fonts/Inter-600.ttf");font-weight:600}
@font-face{font-family:"Inter";src:url("fonts/Inter-700.ttf");font-weight:700}
@font-face{font-family:"Src3";src:url("fonts/SourceSans3-400.ttf");font-weight:400}
@font-face{font-family:"Src3";src:url("fonts/SourceSans3-500.ttf");font-weight:500}
@font-face{font-family:"Src3";src:url("fonts/SourceSans3-600.ttf");font-weight:600}
@font-face{font-family:"Src3";src:url("fonts/SourceSans3-700.ttf");font-weight:700}
/* small-text candidates (Pete, 20 Oct: "I don't like the font of the small text"); headings stay Archivo Narrow */
.fb-inter{--text:"Inter",Arial,sans-serif}
.fb-src3{--text:"Src3",Arial,sans-serif}
.fb-plex{--text:"Plex",Arial,sans-serif}
.fbl{position:absolute;right:48px;bottom:58px;font:600 12px/1 var(--text);color:var(--accent-deep);background:#EEF2FD;padding:5px 8px}

/* ==================== Call 2, v3 (20 Oct): one comparison picture, then a ledger ====================
   Two arrows from the same start on one 0-100% scale: more shares (short, grey) against the four decisions (long,
   the accent). The four steps move into the ledger, each row with what it adds and what it costs, so no second chart
   repeats the first (Pete: "two very similar charts side by side"). */
.c3 .panels{grid-template-columns:repeat(12,1fr)}
.c3 .ar2{position:relative;margin:34px 0 0;height:300px}
.c3 .scl{position:absolute;left:0;right:150px;top:0;bottom:0}
.c3 .today{position:absolute;top:0;bottom:30px;border-left:2px dashed var(--grey)}
.c3 .today span{position:absolute;top:-26px;left:-8px;font:600 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.c3 .lane{position:absolute;left:0;right:0}
.c3 .lane .nm{position:absolute;top:0;left:0;right:-150px;font:600 18px/1.2 var(--head)}
.c3 .lane .nm small{font:400 14px/1.2 var(--text);color:var(--slate);margin-left:8px}
.c3 .lane .shaft{position:absolute;top:40px;height:10px;background:var(--grey)}
.c3 .lane .shaft::after{content:"";position:absolute;right:-16px;top:-8px;border-left:18px solid var(--grey);border-top:13px solid transparent;border-bottom:13px solid transparent}
.c3 .lane .dot{position:absolute;top:36px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ink)}
.c3 .lane .v{position:absolute;transform:translateY(-50%);font:700 40px/1 var(--head);color:var(--grey);white-space:nowrap}
.c3 .lane .sub{position:absolute;top:70px;left:0;right:-150px;font:400 14px/1.4 var(--text);color:var(--slate)}
.c3 .lane .sub b{font-weight:600;color:var(--ink)}
.c3 .lane.on .shaft{background:var(--accent)}
.c3 .lane.on .shaft::after{border-left-color:var(--accent)}
.c3 .lane.on .v{font-size:72px;color:var(--accent)}
.c3 .lane.on .sub{top:96px}
.c3 .lane .v.st,.c3 .lane.on .v.st{transform:translate(calc(-100% - 18px),-50%);font-size:40px;color:var(--grey)}
.c3 .ar2{height:320px}
.c3 .lane .start{position:absolute;top:62px;transform:translateX(-50%);font:600 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.c3 .axis3{position:absolute;left:0;right:0;bottom:0;height:30px;border-top:1.5px solid var(--rule)}
.c3 .axis3 span{position:absolute;top:6px;transform:translateX(-50%);font:400 14px/1 var(--text);color:var(--slate)}
/* the ledger: each decision, what it adds, what it costs */
.c3 .ldg3 li{display:grid;grid-template-columns:30px 1fr 64px;column-gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
.c3 .ldg3 li:first-child{padding-top:2px}
.c3 .ldg3 .n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--ink);color:#fff;font:700 14px/1 var(--head)}
.c3 .ldg3 b{display:block;font:600 16px/1.25 var(--head)}
.c3 .ldg3 b small{font:400 14px/1 var(--text);color:var(--slate);margin-left:6px}
.c3 .ldg3 p{font:400 14px/1.38 var(--text);color:var(--slate);margin-top:3px}
.c3 .ldg3 p em{font-style:normal;font-weight:600;color:var(--ink)}
.c3 .ldg3 .o{text-align:right;font:700 18px/1.3 var(--head)}
.c3 .ldg3 li.top .o{color:var(--accent)}
.c3 .ldg3 .hdr{display:grid;grid-template-columns:30px 1fr 64px;column-gap:12px;font:600 12px/1.2 var(--text);color:var(--slate);padding-bottom:6px}
.c3 .ldg3 .hdr span:last-child{text-align:right}
.c3 .nt{margin-top:auto;background:var(--mist);border-left:3px solid var(--ink);padding:10px 12px;font:400 14px/1.38 var(--text)}
.c3 .nt b{font-weight:600}

/* ==================== Call 2, v4 (20 Oct): the arrow carries the four decisions; the right panel is only the price ====
   Type (Pete: Inter for text; "some of the bolded text are smaller than the little ones"): Archivo Narrow only for
   the title, panel headings, lane names and big numbers; everything else Inter. Scale: title 32 / panel heading and
   lane name 20 / bold label and body 16 / small 14 / tag 12 / numbers 40 and 72. */
.c4{--text:"Inter",Arial,sans-serif}
.c4 .pn>h3{font-size:20px}
.c4 .kick small{font-size:14px}
.c4 .ar4{position:relative;margin-top:30px;height:306px}
.c4 .bar{margin-top:18px}
.c4 .scl{position:absolute;left:0;right:150px;top:0;bottom:0}
.c4 .lane{position:absolute;left:0;right:0}
.c4 .nm{position:absolute;top:0;left:0;right:-150px;font:600 20px/1.2 var(--head)}
.c4 .nm small{font:400 14px/1.2 var(--text);color:var(--slate);margin-left:8px}
.c4 .shaft{position:absolute;height:10px;background:var(--grey)}
.c4 .head{position:absolute;width:0;height:0;margin-top:-8px;border-left:18px solid var(--grey);border-top:13px solid transparent;border-bottom:13px solid transparent}
.c4 .dot{position:absolute;width:18px;height:18px;margin:-4px 0 0 -9px;border-radius:50%;background:var(--ink)}
.c4 .v{position:absolute;transform:translateY(-50%);font:700 40px/1 var(--head);color:var(--grey);white-space:nowrap}
.c4 .v.st{transform:translate(calc(-100% - 18px),-50%)}
.c4 .sub{position:absolute;left:0;right:-150px;font:400 14px/1.4 var(--text);color:var(--slate)}
.c4 .sub b{font-weight:600;color:var(--ink)}
/* the call's arrow: four segments, one a decision, lengths from the model's ladder */
.c4 .on .seg{position:absolute;height:10px;background:var(--accent)}
.c4 .on .head{border-left-color:var(--accent)}
.c4 .on .v.end{font-size:72px;color:var(--accent)}
.c4 .jt{position:absolute;transform:translateX(-50%);font:600 14px/1 var(--text);color:var(--slate)}
.c4 .jt::after{content:"";position:absolute;left:50%;top:18px;height:8px;border-left:1.5px solid var(--grey)}
.c4 .sn{position:absolute;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--ink);color:#fff;font:700 13px/1 var(--text)}
.c4 .axis4{position:absolute;left:0;right:0;bottom:0;height:28px;border-top:1.5px solid var(--rule)}
.c4 .axis4 span{position:absolute;top:6px;transform:translateX(-50%);font:400 14px/1 var(--text);color:var(--slate)}
/* the price list: the same numbers as the arrow's segments; the price is the loud part */
.c4 .px li{display:grid;grid-template-columns:34px 1fr;column-gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--rule)}
.c4 .px li:first-child{padding-top:4px}
.c4 .px .n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--ink);color:#fff;font:700 14px/1 var(--text);margin-top:1px}
.c4 .px b{display:block;font:600 16px/1.3 var(--text)}
.c4 .px b small{font:400 14px/1 var(--text);color:var(--slate);margin-left:6px}
.c4 .px p{font:400 16px/1.38 var(--text);color:var(--slate);margin-top:3px}
.c4 .px p em{font-style:normal;font-weight:700;color:var(--ink)}
.c4 .nt{margin-top:auto;background:var(--mist);border-left:3px solid var(--ink);padding:10px 12px;font:400 14px/1.38 var(--text)}
.c4 .nt b{font-weight:600}
.c4 .bar{font-size:20px}

/* ==================== Call 2, v5 (20 Oct): one top line, one baseline; the right panel has a hierarchy ====================
   Layout rule (Pete: "is the chart vertically centred?"): every panel's content starts 20 px under its heading rule
   and ends on its note at one shared baseline; the space between is spread inside the content, never left as a gap
   at one end. Hierarchy follows the arrow: the home and the business are its two biggest segments and the title's two
   nouns, so they lead the right panel (the home first, as the largest); decisions 1 and 4 are named in the arrow's
   legend and priced in the note. */
.c5{--text:"Inter",Arial,sans-serif}
.c5 .pn>h3{font-size:20px;margin-bottom:20px}
.c5 .kick small{font-size:14px}
.c5 .bar{font-size:20px;margin-top:18px}
.c5 .body{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.c5 .nt{margin-top:22px;background:var(--mist);border-left:3px solid var(--ink);padding:10px 12px;font:400 14px/1.38 var(--text);min-height:59px}
.c5 .pn:last-child .blk:first-child{margin-top:5px}
.c5 .nt b{font-weight:600}
/* left: the two arrows, re-using v4's pieces */
.c5 .lanes{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.c5 .lane{position:relative;margin-right:150px}
.c5 .lane.a{height:96px}
.c5 .lane.b{height:176px}
.c5 .nm{position:absolute;top:0;left:0;right:-150px;font:600 20px/1.2 var(--head)}
.c5 .nm small{font:400 14px/1.2 var(--text);color:var(--slate);margin-left:8px}
.c5 .shaft,.c5 .seg{position:absolute;height:10px;background:var(--grey)}
.c5 .seg{background:var(--accent)}
.c5 .head{position:absolute;width:0;height:0;margin-top:-8px;border-left:18px solid var(--grey);border-top:13px solid transparent;border-bottom:13px solid transparent}
.c5 .b .head{border-left-color:var(--accent)}
.c5 .dot{position:absolute;width:18px;height:18px;margin:-4px 0 0 -9px;border-radius:50%;background:var(--ink)}
.c5 .v{position:absolute;transform:translateY(-50%);font:700 40px/1 var(--head);color:var(--grey);white-space:nowrap}
.c5 .v.st{transform:translate(calc(-100% - 18px),-50%)}
.c5 .b .v.end{font-size:72px;color:var(--accent)}
.c5 .jt{position:absolute;transform:translateX(-50%);font:600 14px/1 var(--text);color:var(--slate)}
.c5 .jt::after{content:"";position:absolute;left:50%;top:18px;height:8px;border-left:1.5px solid var(--grey)}
.c5 .sn{position:absolute;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--ink);color:#fff;font:700 13px/1 var(--text)}
.c5 .sub{position:absolute;left:0;right:-150px;font:400 14px/1.4 var(--text);color:var(--slate)}
.c5 .sub b{font-weight:600;color:var(--ink)}
.c5 .lgd{position:absolute;left:0;right:-150px;display:flex;gap:18px;font:400 14px/1.3 var(--text);color:var(--ink)}
.c5 .lgd span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.c5 .lgd i{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--ink);color:#fff;font:700 11px/1 var(--text);font-style:normal}
/* right: the home (primary, a two-way choice), then the business (secondary) */
.c5 .blk .lbl{display:flex;align-items:center;gap:10px;font:600 16px/1.3 var(--text)}
.c5 .blk .lbl i{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--ink);color:#fff;font:700 13px/1 var(--text);font-style:normal;flex:none}
.c5 .blk .lbl small{font:400 14px/1 var(--text);color:var(--slate)}
.c5 .two{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;margin-top:14px}
.c5 .two div{border-top:3px solid var(--ink);padding-top:10px}
.c5 .two b{display:block;font:600 20px/1.1 var(--head)}
.c5 .two span{display:block;font:400 14px/1.3 var(--text);color:var(--slate)}
.c5 .two strong{display:block;font:700 40px/1 var(--head);margin:12px 0 4px}
.c5 .two .h5{display:flex;justify-content:space-between;align-items:baseline}
.c5 .two .h5 span{display:inline;font:400 14px/1 var(--text);color:var(--slate)}
.c5 .two b.k{display:inline;font:600 14px/1 var(--text);color:var(--ink)}
.c5 .cap5{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:10px}
.c5 .cap5 b{font-weight:600;color:var(--ink)}
.c5 .biz{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.c5 .biz strong{font:700 40px/1 var(--head)}
.c5 .biz p{font:400 14px/1.38 var(--text);color:var(--slate)}
.c5 .biz p b{font-weight:600;color:var(--ink)}

/* ==================== Call 2, v6 (20 Oct): fewer, attached texts ====================
   Pete: "many disconnected text, we're just pushing out text everywhere". v5 had ~35 text pieces in ~15 styles. Rules:
   say each thing once (title = claim, picture = evidence, bar = so-what); attach every label to what it explains (no
   floating sentences, no legend, no notes); one block per idea. The reasons are spoken and live in the speaker notes. */
.c6{--text:"Inter",Arial,sans-serif}
.c6 .pn>h3{font-size:20px;margin-bottom:20px}
.c6 .bar{font-size:20px;margin-top:18px}
.c6 .body{flex:1;display:flex;flex-direction:column;gap:52px;min-height:0;padding-top:4px}
/* left: two arrows, each with its result and its worst year attached */
.c6 .lane{position:relative;margin-right:150px}
.c6 .lane.a{height:116px}
.c6 .pn:last-child .body{justify-content:space-between}
.c6 .pn:first-child .body{justify-content:space-between}
.c6 .lane.b{height:163px}
.c6 .nm{position:absolute;top:0;left:0;right:-150px;font:600 20px/1.2 var(--head)}
.c6 .nm small{font:400 16px/1.2 var(--text);color:var(--slate);margin-left:8px}
.c6 .shaft,.c6 .seg{position:absolute;height:14px;margin-top:-2px;background:var(--grey)}
.c6 .seg{background:var(--accent)}
.c6 .head{position:absolute;width:0;height:0;margin-top:-8px;border-left:18px solid var(--grey);border-top:13px solid transparent;border-bottom:13px solid transparent}
.c6 .b .head{border-left-color:var(--accent)}
.c6 .dot{position:absolute;width:18px;height:18px;margin:-4px 0 0 -9px;border-radius:50%;background:var(--ink)}
.c6 .v{position:absolute;font:700 40px/1 var(--head);color:var(--grey);white-space:nowrap}
.c6 .v.st{transform:translate(calc(-100% - 18px),-50%)}
.c6 .res{position:absolute;transform:translateY(-50%);white-space:nowrap}
.c6 .res b{display:block;font:700 40px/1 var(--head);color:var(--grey)}
.c6 .res span{display:block;font:400 14px/1.2 var(--text);color:var(--slate);margin-top:4px}
.c6 .res span em{font-style:normal;font-weight:600;color:var(--ink)}
.c6 .b .res b{font-size:72px;color:var(--accent)}
/* the call's segments carry their own names */
.c6 .sl{position:absolute;transform:translateX(-50%);font:600 14px/1 var(--text);color:var(--ink);white-space:nowrap}
.c6 .sl::after{content:"";position:absolute;left:50%;top:18px;height:7px;border-left:1.5px solid var(--grey)}
/* right: one block per idea */
.c6 .lbl{font:600 16px/1.3 var(--text)}
.c6 .lbl small{font:400 14px/1 var(--text);color:var(--slate);margin-left:6px}
.c6 .two{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;margin-top:12px}
.c6 .two div{border-top:3px solid var(--ink);padding-top:12px;padding-bottom:4px}
.c6 .two b{display:block;font:600 20px/1.1 var(--head)}
.c6 .two span{display:block;font:400 14px/1.3 var(--text);color:var(--slate)}
.c6 .two strong{display:block;font:700 40px/1 var(--head);margin-top:18px}
.c6 .cap6{font:400 14px/1.3 var(--text);color:var(--slate);margin-top:12px}
.c6 .biz{display:flex;align-items:baseline;gap:14px;margin-top:14px;padding-top:12px;border-top:3px solid var(--ink)}
.c6 .biz strong{font:700 40px/1 var(--head)}
.c6 .biz span{font:400 16px/1.3 var(--text);color:var(--slate)}

/* ==================== v9 slides 3 and 7 (22 Oct): the ten futures, their own way, then with the plan ====================
   One picture, drawn twice in the same place: slide 3 (their own way) marks where the flat is sold and where the money
   still runs out; slide 7 (the plan) redraws ten typical futures, all reaching 89, with slide 3's sale marks left as
   hollow ghosts. The model gives x = (year - 2026) / 40; the plot shows only the window 2051-2066 (Carmen 74 to 89,
   Pete 22 Oct: "the thing we're focusing on is just the 2056-2066 part"), so x is re-mapped with --y0 (years from 2026
   to the window's start) and --yn (the window's length); the lines fade in from the left, and make_looks.py fails if
   any event falls before the window. The accent is the title's claim: on 3 the sale and what it leaves the children;
   on 7 the futures that reach 89. */
.c9{--text:"Inter",Arial,sans-serif}
.c9 .pn>h3{font-size:20px;margin-bottom:0}
.c9 .bar{font-size:20px;margin-top:18px}
.c9 .ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.c9 .lede{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:8px}
.c9 .body{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding-top:16px}
/* the plot: a band for Carmen's years alone, the goal line at 89, ten rows, the sale bracket, the axis */
.f9{--y0:25;--yn:15;position:relative;margin-right:28px;padding-top:26px}
.f9 .alone{position:absolute;top:0;bottom:0;left:calc((30 - var(--y0)) / var(--yn) * 100%);right:0;background:var(--mist)}
.f9 .brk>span.from{left:0;transform:none;font-weight:400;color:var(--slate)}   /* the crop, said where the axis starts */
.f9 .alone span{position:absolute;top:7px;left:10px;font:400 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.f9 .goal{position:absolute;top:0;bottom:0;left:100%;border-left:1.5px dashed var(--ink)}
.f9 .goal span{position:absolute;top:7px;right:8px;font:600 14px/1 var(--text);white-space:nowrap}
.f9 .rows{position:relative;display:flex;flex-direction:column;gap:7px;padding:8px 0 10px}
.f9r{position:relative;height:17px}
.f9r .ln{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn));background:linear-gradient(to right,rgba(160,160,160,0),var(--grey) 56px)}
.f9r .end{position:absolute;top:50%;left:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn));width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.f9r .end .ic{width:12px;height:12px;stroke-width:3.2}
.f9r.short .end{background:var(--ink);color:#fff}
.f9r.short .end .v,.f9r.sold .end .x,.f9r.kept .end .x,.f9r.lasts .end .x{display:none}
.f9r.sold .end,.f9r.kept .end,.f9r.lasts .end{background:var(--paper);border:2px solid var(--ink);color:var(--ink)}
.f9r .hs{position:absolute;top:50%;left:calc((var(--s) * 40 - var(--y0) * 100%) / var(--yn));width:26px;height:26px;margin:-13px 0 0 -13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
.f9r .hs .ic{width:16px;height:16px;stroke-width:2.4}
.f9r.kept .hs{display:none}
/* slide 3: the crosses' label, attached to the lowest one: what the late sale buys */
.f9r .tl{position:absolute;top:50%;left:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn) + 18px);transform:translateY(-50%);font:600 14px/1 var(--text);color:var(--ink);white-space:nowrap;z-index:2}
.f9r:not(.short) .tl{display:none}
/* slide 7: every line reaches 89 in the accent; slide 3's sales stay as hollow grey ghosts */
.f9.won .f9r .ln{background:linear-gradient(to right,rgba(29,78,216,0),var(--accent) 56px)}
.f9.won .f9r.lasts .end{border-color:var(--accent);color:var(--accent)}
.f9r .gh{position:absolute;top:50%;left:calc((var(--s) * 40 - var(--y0) * 100%) / var(--yn));width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px dashed var(--grey);background:var(--paper);color:var(--grey);display:flex;align-items:center;justify-content:center;z-index:3}
.f9r .gh .ic{width:15px;height:15px;stroke-width:2}
.f9r.g-kept .gh{display:none}
/* the bracket under the sale marks, its label attached */
.f9 .brk{position:relative;height:34px}
.f9 .brk>i{position:absolute;top:0;height:10px;border:2px solid var(--accent);border-top:0}
.f9 .brk>span{position:absolute;top:16px;transform:translateX(-50%);font:600 14px/1 var(--text);color:var(--accent-deep);white-space:nowrap}
.f9.won .brk>i{border-color:var(--grey)}
.f9.won .brk>span{color:var(--slate);font-weight:400}
.f9 .brk>span.ra{transform:translateX(-100%)}   /* right-aligned to the bracket's end, clear of the 89 line */
.f9ax{position:relative;height:40px;margin-right:28px;border-top:1.5px solid var(--ink)}
.f9ax span{position:absolute;top:7px;transform:translateX(-50%);font:600 14px/1.25 var(--text);white-space:nowrap;text-align:center}
.f9ax span:first-child{transform:none;text-align:left}
.f9ax span:last-child{transform:translateX(-100%);text-align:right}
.f9ax span i{display:block;font-style:normal;font-weight:400;color:var(--slate)}
/* slide 3, right: the home, then what the children are left */
.c9 .home{height:190px;background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:400 14px/1.3 var(--text);color:var(--slate);text-align:center}
.c9 .home .ic{width:44px;height:44px;stroke-width:1.4;color:var(--ink)}
.c9 .homec{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:8px}
.c9 .inh .l{font:600 16px/1.3 var(--text)}
.c9 .inh strong{display:block;font:700 72px/1 var(--head);color:var(--accent);margin:8px 0 6px;letter-spacing:-1px}
.c9 .inh p.s{font:400 14px/1.35 var(--text);color:var(--slate)}
/* slide 7, right: the premium line (series.py), the review's result, the rules */
.c9 .pc{position:relative;height:150px;margin:22px 0 0 44px}
.c9 .pc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.c9 .pc .gl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.c9 .pc .gl span{position:absolute;right:calc(100% + 8px);top:-8px;font:400 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.c9 .pc .sw{position:absolute;top:-24px;bottom:0;border-left:1.5px solid var(--ink)}
.c9 .pc .sw span{position:absolute;top:0;right:8px;font:600 14px/1.25 var(--text);white-space:nowrap;text-align:right}
.c9 .pc .pk{position:absolute;transform:translateY(-30%);padding-left:12px;white-space:nowrap}
.c9 .pc .en{position:absolute;right:0;transform:translateY(-130%);font:600 14px/1 var(--text);white-space:nowrap}
.c9 .pc .pk b{display:block;font:700 20px/1 var(--head)}
.c9 .pc .pk span{display:block;font:400 14px/1.3 var(--text);color:var(--slate)}
.c9 .pcx{position:relative;height:22px;margin-left:44px;border-top:1.5px solid var(--ink)}
.c9 .pcx span{position:absolute;top:5px;transform:translateX(-50%);font:400 14px/1 var(--text);color:var(--slate)}
.c9 .pcx span:first-child{transform:none}.c9 .pcx span:last-child{transform:translateX(-100%)}
.c9 .rev{display:flex;align-items:baseline;gap:12px;padding-top:12px;border-top:3px solid var(--ink)}
.c9 .rev strong{font:700 40px/1 var(--head)}
.c9 .rev span{font:400 16px/1.3 var(--text);color:var(--slate)}
.c9 .rules{font:400 14px/1.4 var(--text);color:var(--slate);margin-top:8px}
.c9 .rules b{font-weight:600;color:var(--ink)}
.notes{display:none}
</style>
</head>
