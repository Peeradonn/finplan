<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built to Last</title>
<!--
  Built to Last, Round Two deck (v9, 22 Oct 2026): the plan is round2/Round2_Deck_Plan.md; the talk and its timing are
  round2/Talk_Outline.md. Look B (Pete, 20 Oct): white, near-black ink, one cobalt accent; Archivo Narrow for titles,
  panel headings and big numbers, Inter for all text. Scale, no other sizes: title 32, panel heading 20, bold label and
  body 16, small 14, tag and source 12, numbers 40 and 72. Fonts: SIL Open Font License (fonts/OFL-*.txt).
  Every slide's script is its <aside class="notes">: the spoken words, then "[Notes: ...]" for background. make.py
  writes them to Axis_Script.html and Axis_Script.md.
-->
<style>
@font-face{font-family:"ArchN";src:url("fonts/ArchivoNarrow-500.ttf");font-weight:500}
@font-face{font-family:"ArchN";src:url("fonts/ArchivoNarrow-600.ttf");font-weight:600}
@font-face{font-family:"ArchN";src:url("fonts/ArchivoNarrow-700.ttf");font-weight:700}
@font-face{font-family:"Inter";src:url("fonts/Inter-400.ttf");font-weight:400}
@font-face{font-family:"Inter";src:url("fonts/Inter-500.ttf");font-weight:500}
@font-face{font-family:"Inter";src:url("fonts/Inter-600.ttf");font-weight:600}
@font-face{font-family:"Inter";src:url("fonts/Inter-700.ttf");font-weight:700}

/* ---- look B, as tokens ---- */
.lb{--paper:#FFFFFF;--mist:#F2F2F2;--rule:#D9D9D9;--grey:#A0A0A0;--slate:#545454;--ink:#121212;
    --accent:#1D4ED8;--accent-deep:#173EA9;--text:"Inter",Arial,sans-serif;--head:"ArchN","Arial Narrow",sans-serif}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#DADDE0}
p,h1,h2,h3,h4,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.deck{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0}
.slide{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:var(--paper);color:var(--ink);
  font:400 16px/1.42 var(--text);padding:34px 48px 0;display:flex;flex-direction:column}
@page{size:1280px 720px;margin:0}
@media print{body{background:#fff}.deck{gap:0;padding:0;display:block}.slide{break-after:page}}
p,li,span,b{text-wrap:pretty}
.tag{font:400 12px/1 var(--text);color:var(--slate);white-space:nowrap}
.tag::before{content:"("}.tag::after{content:")"}

/* ---- header: kicker, title ---- */
.hd{display:flex;flex-direction:column;gap:6px}
.kick{display:flex;align-items:center;gap:10px;font:600 18px/1.2 var(--head);color:var(--slate)}
.kick small{font:400 14px/1 var(--text);color:var(--slate)}
.hd h2{font:600 32px/1.12 var(--head);letter-spacing:-.2px;max-width:1100px;text-wrap:balance}

/* ---- three panels on a 12-column grid; headings on a rule read as one sentence ---- */
.panels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;margin-top:22px}
.pn{display:flex;flex-direction:column;min-width:0}
.pn>h3{font:600 18px/1.25 var(--head);padding-bottom:8px;border-bottom:1.5px solid var(--ink);margin-bottom:14px}
.cap{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:auto;padding-top:8px}

/* ---- conclusion bar ---- */
.bar{flex:none;margin-top:16px;background:var(--ink);color:#fff;font:600 18px/1.3 var(--head);padding:12px 24px;text-align:center;text-wrap:balance}

/* ---- footer ---- */
.ft{flex:none;height:52px;display:flex;align-items:center;gap:20px;font:400 12px/1.3 var(--text);color:var(--slate)}
.ft .src{flex:1}


/* ==================== B · Swiss ==================== */
.lb .gb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--accent);color:#fff;font:700 18px/1 var(--head);flex:none}
.lb .kick{color:var(--accent-deep)}
.lb .dimn{position:absolute;top:8px;height:12px;border:2px solid var(--ink);border-top:0}
.lb .dimn span{position:absolute;left:50%;top:18px;transform:translateX(-50%);font:600 14px/1 var(--head);white-space:nowrap}
.lb .dimx{display:none}
.lb .trk{position:absolute;top:36px;right:48px;display:flex;gap:6px;font:600 14px/1 var(--head);color:var(--grey)}
.lb .trk span{padding:5px 8px;border:1.5px solid var(--rule)}
.lb .trk span.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* cover B */
.lb.cv{padding:0}
.lb.cv .top{height:14px;background:var(--accent);width:240px;margin:56px 0 0 56px}
.lb.cv h1{font:700 150px/.9 var(--head);letter-spacing:-3px;margin:40px 0 0 52px}
.lb.cv .sub{font:400 24px/1.35 var(--text);margin:26px 0 0 56px;max-width:620px}
.lb.cv .ev{position:absolute;top:56px;right:56px;text-align:right;font:400 14px/1.4 var(--text);color:var(--slate)}
.lb.cv .bot{position:absolute;left:56px;right:56px;bottom:40px;display:flex;align-items:flex-end;gap:28px}
.lb.cv .who{display:flex;gap:28px;font:400 14px/1.35 var(--text);color:var(--slate);flex:1}
.lb.cv .who b{display:block;font:600 16px/1.3 var(--head);color:var(--ink)}
.lb.cv .fam{display:flex;gap:14px}
.lb.cv .fam .pic{width:104px;height:104px;border:0;background:var(--mist);margin:0}
.lb.cv .note{position:absolute;right:56px;bottom:14px;font:400 12px/1.3 var(--text);color:var(--slate)}


/* ==================== v9 slides 3 and 7 (22 Oct): the ten futures, their own way, then with the plan ====================
   One picture, drawn twice in the same place: slide 3 (their own way) marks where the flat is sold and where the money
   still runs out; slide 7 (the plan) redraws ten typical futures, all reaching 89, with slide 3's sale marks left as
   hollow ghosts. The model gives x = (year - 2026) / 40; the plot shows only the window 2051-2066 (Carmen 74 to 89,
   Pete 22 Oct: "the thing we're focusing on is just the 2056-2066 part"), so x is re-mapped with --y0 (years from 2026
   to the window's start) and --yn (the window's length); the lines fade in from the left, and make_looks.py fails if
   any event falls before the window. The accent is the title's claim: on 3 the sale and what it leaves the children;
   on 7 the futures that reach 89. */
.c9{--text:"Inter",Arial,sans-serif}
.c9 .pn>h3{font-size:20px;margin-bottom:0}
.c9 .bar{font-size:20px;margin-top:18px}
.c9 .ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.c9 .lede{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:8px}
.c9 .body{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding-top:16px}
/* the plot: a band for Carmen's years alone, the goal line at 89, ten rows, the sale bracket, the axis */
.f9{--y0:25;--yn:15;position:relative;margin-right:28px;padding-top:26px}
.f9 .alone{position:absolute;top:0;bottom:0;left:calc((30 - var(--y0)) / var(--yn) * 100%);right:0;background:var(--mist)}
.f9 .brk>span.from{left:0;transform:none;font-weight:400;color:var(--slate)}   /* the crop, said where the axis starts */
.f9 .alone span{position:absolute;top:7px;left:10px;font:400 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.f9 .goal{position:absolute;top:0;bottom:0;left:100%;border-left:1.5px dashed var(--ink)}
.f9 .goal span{position:absolute;top:7px;right:8px;font:600 14px/1 var(--text);white-space:nowrap}
.f9 .rows{position:relative;display:flex;flex-direction:column;gap:7px;padding:8px 0 10px}
.f9r{position:relative;height:17px}
.f9r .ln{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn));background:linear-gradient(to right,rgba(160,160,160,0),var(--grey) 56px)}
.f9r .end{position:absolute;top:50%;left:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn));width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.f9r .end .ic{width:12px;height:12px;stroke-width:3.2}
.f9r.short .end{background:var(--ink);color:#fff}
.f9r.short .end .v,.f9r.sold .end .x,.f9r.kept .end .x,.f9r.lasts .end .x{display:none}
.f9r.sold .end,.f9r.kept .end,.f9r.lasts .end{background:var(--paper);border:2px solid var(--ink);color:var(--ink)}
.f9r .hs{position:absolute;top:50%;left:calc((var(--s) * 40 - var(--y0) * 100%) / var(--yn));width:26px;height:26px;margin:-13px 0 0 -13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
.f9r .hs .ic{width:16px;height:16px;stroke-width:2.4}
.f9r.kept .hs{display:none}
/* slide 3: the crosses' label, attached to the lowest one: what the late sale buys */
.f9r .tl{position:absolute;top:50%;left:calc((var(--w) * 40 - var(--y0) * 100%) / var(--yn) + 18px);transform:translateY(-50%);font:600 14px/1 var(--text);color:var(--ink);white-space:nowrap;z-index:2}
.f9r:not(.short) .tl{display:none}

/* ==================== v9 slide 6, Call 2 (22 Oct): what they own -> what each becomes -> what it achieves ============
   Option B "Put to work" (Pete, 20 Oct), set against their own way (slide 3). Rows run across the first two columns so
   each asset sits beside its decision; rows are ranked by what moves the odds (the home first, the tallest, the only
   large number), and the business row says what really changes (both ways sell it; ours is planned and counted low).
   The third column reads top to bottom, their own way (grey) to decided now (the accent, the title's claim). */
.k9{display:grid;grid-template-columns:378.67px 479.33px;column-gap:24px;grid-template-rows:auto 1fr;min-height:0}
.k9>h3{font:600 20px/1.25 var(--head);padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.k9 .rws{grid-column:1 / -1;display:flex;flex-direction:column;min-height:0;padding-top:4px}
.k9 .rw{display:grid;grid-template-columns:378.67px 479.33px;column-gap:24px;align-items:center;border-bottom:1px solid var(--rule);flex:1}
.k9 .rw:last-child{border-bottom:0}
.k9 .rw.big{flex:1.45}
.k9 .own b{display:block;font:600 16px/1.3 var(--text)}
.k9 .own .tr{display:flex;align-items:center;gap:10px;margin-top:8px}
.k9 .own .tr i{display:block;height:14px;background:var(--grey)}
.k9 .own .tr span{font:600 16px/1 var(--text);white-space:nowrap}
.k9 .own .fl{font:400 16px/1.3 var(--text);color:var(--slate);margin-top:6px}
.k9 .to{position:relative;padding-left:34px}
.k9 .to>.ic{position:absolute;left:0;top:50%;width:22px;height:22px;margin-top:-11px;color:var(--ink);stroke-width:2.4}
.k9 .to b{display:block;font:600 16px/1.3 var(--text)}
.k9 .to p{font:400 14px/1.38 var(--text);color:var(--slate);margin-top:2px}
.k9 .to .n{display:flex;align-items:baseline;gap:10px}
.k9 .to .n strong{font:700 40px/1 var(--head)}
.k9 .to .n span{font:600 16px/1.3 var(--text)}
/* the third column: their own way and decided now as two bars on one scale (0 to 100%), grey then the accent */
.k9b{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-top:16px;min-height:0}
.k9b .cap9{font:400 14px/1.35 var(--text);color:var(--slate)}
.k9b .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.k9b .tk{position:relative;height:236px;border-bottom:1.5px solid var(--ink)}
.k9b .tk i{position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--grey)}
.k9b .tk strong{position:absolute;left:0;bottom:calc(var(--h) + 8px);font:700 40px/1 var(--head);color:var(--grey)}
.k9b .now .tk i{background:var(--accent)}
.k9b .now .tk strong{font-size:72px;color:var(--accent);letter-spacing:-1px}
.k9b .c p{font:600 16px/1.3 var(--text);margin-top:8px}
.k9b .c p span{display:block;font:400 14px/1.35 var(--text);color:var(--slate)}
/* slide 7: every line reaches 89 in the accent; slide 3's sales stay as hollow grey ghosts */
.f9.won .f9r .ln{background:linear-gradient(to right,rgba(29,78,216,0),var(--accent) 56px)}
.f9.won .f9r.lasts .end{border-color:var(--accent);color:var(--accent)}
.f9r .gh{position:absolute;top:50%;left:calc((var(--s) * 40 - var(--y0) * 100%) / var(--yn));width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px dashed var(--grey);background:var(--paper);color:var(--grey);display:flex;align-items:center;justify-content:center;z-index:3}
.f9r .gh .ic{width:15px;height:15px;stroke-width:2}
.f9r.g-kept .gh{display:none}
/* the bracket under the sale marks, its label attached */
.f9 .brk{position:relative;height:34px}
.f9 .brk>i{position:absolute;top:0;height:10px;border:2px solid var(--accent);border-top:0}
.f9 .brk>span{position:absolute;top:16px;transform:translateX(-50%);font:600 14px/1 var(--text);color:var(--accent-deep);white-space:nowrap}
.f9.won .brk>i{border-color:var(--grey)}
.f9.won .brk>span{color:var(--slate);font-weight:400}
.f9 .brk>span.ra{transform:translateX(-100%)}   /* right-aligned to the bracket's end, clear of the 89 line */
.f9ax{position:relative;height:40px;margin-right:28px;border-top:1.5px solid var(--ink)}
.f9ax span{position:absolute;top:7px;transform:translateX(-50%);font:600 14px/1.25 var(--text);white-space:nowrap;text-align:center}
.f9ax span:first-child{transform:none;text-align:left}
.f9ax span:last-child{transform:translateX(-100%);text-align:right}
.f9ax span i{display:block;font-style:normal;font-weight:400;color:var(--slate)}
/* slide 3, right: the home, then what the children are left */
.c9 .home{height:190px;background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:400 14px/1.3 var(--text);color:var(--slate);text-align:center}
.c9 .home .ic{width:44px;height:44px;stroke-width:1.4;color:var(--ink)}
.c9 .homec{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:8px}
.c9 .inh .l{font:600 16px/1.3 var(--text)}
.c9 .inh strong{display:block;font:700 72px/1 var(--head);color:var(--accent);margin:8px 0 6px;letter-spacing:-1px}
.c9 .inh p.s{font:400 14px/1.35 var(--text);color:var(--slate)}
/* slide 7, right: the premium line (series.py), the review's result, the rules */
.c9 .pc{position:relative;height:150px;margin:22px 0 0 44px}
.c9 .pc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.c9 .pc .gl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.c9 .pc .gl span{position:absolute;right:calc(100% + 8px);top:-8px;font:400 14px/1 var(--text);color:var(--slate);white-space:nowrap}
.c9 .pc .sw{position:absolute;top:-24px;bottom:0;border-left:1.5px solid var(--ink)}
.c9 .pc .sw span{position:absolute;top:0;right:8px;font:600 14px/1.25 var(--text);white-space:nowrap;text-align:right}
.c9 .pc .pk{position:absolute;transform:translateY(-30%);padding-left:12px;white-space:nowrap}
.c9 .pc .en{position:absolute;right:0;transform:translateY(-130%);font:600 14px/1 var(--text);white-space:nowrap}
.c9 .pc .pk b{display:block;font:700 20px/1 var(--head)}
.c9 .pc .pk span{display:block;font:400 14px/1.3 var(--text);color:var(--slate)}
.c9 .pcx{position:relative;height:22px;margin-left:44px;border-top:1.5px solid var(--ink)}
.c9 .pcx span{position:absolute;top:5px;transform:translateX(-50%);font:400 14px/1 var(--text);color:var(--slate)}
.c9 .pcx span:first-child{transform:none}.c9 .pcx span:last-child{transform:translateX(-100%)}
.c9 .rev{display:flex;align-items:baseline;gap:12px;padding-top:12px;border-top:3px solid var(--ink)}
.c9 .rev strong{font:700 40px/1 var(--head)}
.c9 .rev span{font:400 16px/1.3 var(--text);color:var(--slate)}
.c9 .rules{font:400 14px/1.4 var(--text);color:var(--slate);margin-top:8px}
.c9 .rules b{font-weight:600;color:var(--ink)}

/* ==================== v9 slide 2 (23 Oct): four people, four wants, and on paper secure ====================
   Stacked: the four people across the slide (each want returns later as a call), then the strength as one band, the
   net worth in the accent: the title's claim. */
.x2{flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:20px;min-height:0}
.x2 h3{font:600 20px/1.25 var(--head);padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.x2-pp{display:grid;grid-template-columns:repeat(4,1fr);column-gap:24px;margin-top:18px}
.x2-pp .pic{width:150px;height:150px;border:0;background:var(--mist);margin:0 0 14px}
.x2-pp h4{font:600 20px/1.2 var(--head)}
.x2-pp .r{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:2px}
.x2-pp .w{font:400 16px/1.4 var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.x2-st{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;margin-top:18px;align-items:end}
.x2-st>div{display:flex;align-items:baseline;gap:12px}
.x2-st strong{font:700 40px/1 var(--head)}
.x2-st strong.on{font-size:72px;color:var(--accent);letter-spacing:-1px}
.x2-st p{font:400 16px/1.35 var(--text);color:var(--slate)}

/* ==================== v9 slide 4 (23 Oct): the answer, as the map the call slides expand ====================
   The family's own words, then the five calls in the order the talk takes them (the numbers match the tracker), then
   the impact band: their own way in grey, the plan's result in the accent, the only accent on the slide. */
.x4{flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:20px;min-height:0}
.x4-q{border-left:4px solid var(--ink);padding:4px 0 4px 16px}
.x4-q p{font:600 22px/1.3 var(--head)}
.x4-q span{display:block;font:400 14px/1.3 var(--text);color:var(--slate);margin-top:4px}
.x4-c{display:grid;grid-template-columns:repeat(5,1fr);column-gap:24px}
.x4-c>div{border-top:1.5px solid var(--ink);padding-top:14px}
.x4-c .t{display:flex;align-items:center;gap:10px}
.x4-c .t i{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--ink);color:#fff;font:700 16px/1 var(--head);font-style:normal}
.x4-c .t .ic{width:26px;height:26px;stroke-width:1.8;color:var(--ink);fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.x4-c h4{font:600 20px/1.2 var(--head);margin-top:12px;min-height:48px}
.x4-c p{font:400 14px/1.4 var(--text);color:var(--slate);margin-top:6px}
.x4-i{display:flex;align-items:flex-end;gap:28px;padding-top:16px;border-top:3px solid var(--ink)}
.x4-i .l{font:600 16px/1.3 var(--text);max-width:170px;padding-bottom:8px}
.x4-i .v{display:flex;align-items:baseline;gap:10px}
.x4-i .v strong{font:700 40px/1 var(--head);color:var(--grey)}
.x4-i .v span{font:400 16px/1.3 var(--text);color:var(--slate)}
.x4-i .v.on strong{font-size:72px;color:var(--accent);letter-spacing:-1px}
.x4-i .v.on span{color:var(--ink);font-weight:600}
.x4-i .ar{font:400 40px/1 var(--text);color:var(--grey);padding-bottom:10px}
.x4-i .h{font:400 16px/1.35 var(--text);color:var(--slate);margin-left:auto;max-width:250px;padding-bottom:8px;text-align:right}

/* ==================== v9 slide 5, Call 1 (23 Oct): the gap, what closes it, the papers ====================
   Panel 1: pay that continues if a parent can't work, today (nothing, a dashed empty bar) against with cover (ink
   bars, Adrian's HK$65K a month = the full track). Panel 2: the year-1 cost as one stacked bar and the one large
   number in the accent (the title's claim). Panel 3: the papers in month one, as a checklist. */
.x5-p{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.x5-p .who{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.x5-p .who .pic{width:64px;height:64px;border:0;background:var(--mist);margin:0}
.x5-p .who b{font:600 20px/1.2 var(--head)}
.x5-p .who b span{font-weight:400;color:var(--slate);margin-left:6px;font-size:14px}
.x5-p .row{display:grid;grid-template-columns:96px 1fr;column-gap:12px;align-items:center;margin-top:10px}
.x5-p .row>span{font:400 14px/1.2 var(--text);color:var(--slate)}
.x5-p .tk{position:relative;height:28px}
.x5-p .tk i{position:absolute;left:0;top:0;bottom:0}
.x5-p .tk.no i{width:100%;border:1.5px dashed var(--grey)}
.x5-p .tk.no em{position:absolute;left:10px;top:50%;transform:translateY(-50%);font:400 14px/1 var(--text);font-style:normal;color:var(--slate)}
.x5-p .tk.yes i{background:var(--ink)}
.x5-p .tk.yes em{position:absolute;top:50%;transform:translateY(-50%);font:600 16px/1 var(--text);font-style:normal;white-space:nowrap}
.x5-c strong{display:block;font:700 72px/1 var(--head);color:var(--accent);letter-spacing:-1px}
.x5-c .s{font:600 16px/1.35 var(--text);margin-top:6px}
.x5-c{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.x5-c .stk{display:flex;height:32px}
.x5-c .stk i{display:block;height:100%;border-right:2px solid var(--paper)}
.x5-c .lg{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:14px}
.x5-c .lg p{font:400 14px/1.3 var(--text);color:var(--slate);display:flex;gap:8px;align-items:flex-start}
.x5-c .lg p i{flex:none;width:12px;height:12px;margin-top:3px}
.x5-c .lg p b{display:block;font:600 14px/1.3 var(--text);color:var(--ink)}
.x5-c .tm{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.x5-d{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.x5-d li{display:flex;gap:12px;padding:0 0 18px;border-bottom:1px solid var(--rule)}
.x5-d li:last-child{border-bottom:0;padding-bottom:4px}
.x5-d li:first-child{padding-top:4px}
.x5-d li .ic{flex:none;width:22px;height:22px;stroke-width:2.6;color:var(--ink);fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.x5-d b{display:block;font:600 16px/1.3 var(--text)}
.x5-d p{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:2px}
.x5-d .cost{font:400 14px/1.35 var(--text);color:var(--slate);margin-top:14px}

/* ---- a portrait: a circle that crops its image (the cover's family; later the people on 2 and 14) ---- */
.pic{display:block;width:160px;height:160px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink);background:#fff;margin-bottom:10px}
.pic img{width:100%;height:100%;object-fit:cover}

/* ---- a slide still to build: its title and the picture the plan asks for (plan §5) ---- */
.todo-box{flex:1;margin-top:22px;border:1.5px dashed var(--grey);display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:10px;padding:24px;text-align:center}
.todo-box b{font:600 20px/1.2 var(--head);color:var(--slate)}
.todo-box p{font:400 16px/1.4 var(--text);color:var(--slate);max-width:760px}

/* ---- builds: data-b="n" is the step an element appears in; make.py --builds repeats a slide once per step with class
   upto-k, which hides later steps (visibility, so the layout never moves) ---- */
.upto-1 [data-b="2"],.upto-1 [data-b="3"],.upto-1 [data-b="4"],.upto-1 [data-b="5"],.upto-1 [data-b="6"],.upto-1 [data-b="7"],.upto-1 [data-b="8"],.upto-1 [data-b="9"]{visibility:hidden}
.upto-2 [data-b="3"],.upto-2 [data-b="4"],.upto-2 [data-b="5"],.upto-2 [data-b="6"],.upto-2 [data-b="7"],.upto-2 [data-b="8"],.upto-2 [data-b="9"]{visibility:hidden}
.upto-3 [data-b="4"],.upto-3 [data-b="5"],.upto-3 [data-b="6"],.upto-3 [data-b="7"],.upto-3 [data-b="8"],.upto-3 [data-b="9"]{visibility:hidden}
.upto-4 [data-b="5"],.upto-4 [data-b="6"],.upto-4 [data-b="7"],.upto-4 [data-b="8"],.upto-4 [data-b="9"]{visibility:hidden}
.upto-5 [data-b="6"],.upto-5 [data-b="7"],.upto-5 [data-b="8"],.upto-5 [data-b="9"]{visibility:hidden}
.upto-6 [data-b="7"],.upto-6 [data-b="8"],.upto-6 [data-b="9"]{visibility:hidden}
.upto-7 [data-b="8"],.upto-7 [data-b="9"]{visibility:hidden}
.upto-8 [data-b="9"]{visibility:hidden}
.notes{display:none}
</style>
